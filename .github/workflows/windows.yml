name: Windows

# Sona pour Windows (dossier desktop/) : fabrique l'installateur .exe, la
# version portable (avec le module iPhone en Rust) et le plugin Stream Deck.
# L'app embarque Sona web (web/) : elle se refabrique aussi quand le site
# change. Seulement dans ces cas-là : une minute de runner
# Windows compte double dans le quota gratuit d'Actions.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: Sona pour Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    # Publication sur master : mise à jour de la version « windows ».
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/streamdeck/package-lock.json

      - name: Numéroter la version
        # 1.0.<numéro d'exécution> : toujours plus grand que la version
        # installée, c'est ce que compare la recherche de mises à jour de l'app.
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe
        run: npm run check

      - name: Tests de la télécommande
        run: npm test

      # ── Module iPhone (Rust : compte Apple, signature, envoi) ──────────
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/iphone

      - name: Compiler le module iPhone
        working-directory: desktop/iphone
        run: |
          cargo test --release
          cargo build --release

      - name: Fabriquer l'installateur et la version portable
        # Pas de certificat de signature : l'.exe n'est pas signé (Windows
        # SmartScreen le signale au premier lancement, voir desktop/README.md).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      # ── Plugin Stream Deck ──────────────────────────────────────────────
      - name: Plugin Stream Deck
        working-directory: desktop/streamdeck
        shell: bash
        run: |
          npm ci
          npm test
          node -e "const f='app.sona.remote.sdPlugin/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.Version=process.env.VERSION+'.0';fs.writeFileSync(f,JSON.stringify(m,null,2))"
          npm run build
          npx streamdeck validate app.sona.remote.sdPlugin
          npx streamdeck pack app.sona.remote.sdPlugin --output dist --force
          mv dist/app.sona.remote.streamDeckPlugin ../dist/Sona-StreamDeck.streamDeckPlugin

      - name: Décrire la version (latest.json)
        # Lu par l'app au démarrage puis toutes les 6 h : numéro de version,
        # adresse de l'installateur et son empreinte SHA-256 (vérifiée avant
        # de l'exécuter).
        shell: bash
        env:
          REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          node - <<'JS'
          const fs = require("fs"), crypto = require("crypto");
          const { VERSION: version, REPO: repo } = process.env;
          const base = `https://github.com/${repo}/releases/download/windows`;
          const file = (name) => {
            const data = fs.readFileSync(`dist/${name}`);
            return { url: `${base}/${name}`, size: data.length, sha256: crypto.createHash("sha256").update(data).digest("hex") };
          };
          const latest = {
            version,
            date: new Date().toISOString(),
            notes: (process.env.MESSAGE || "").split("\n")[0].slice(0, 300),
            setup: file(`Sona-Setup-${version}.exe`),
            portable: file(`Sona-Portable-${version}.exe`),
            streamdeck: file("Sona-StreamDeck.streamDeckPlugin"),
          };
          fs.writeFileSync("dist/latest.json", JSON.stringify(latest, null, 2));
          console.log(JSON.stringify(latest, null, 2));
          JS

      - name: Garder les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: Sona-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.streamDeckPlugin
            desktop/dist/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publier la version Windows
        # Toujours la même version « windows », en préversion : elle ne prend
        # jamais la place de la dernière version iOS (« latest »), que SideStore
        # et l'onglet iPhone de l'app lisent pour Sona sur iPhone.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=(dist/Sona-Setup-$VERSION.exe dist/Sona-Portable-$VERSION.exe dist/Sona-StreamDeck.streamDeckPlugin dist/latest.json)
          NOTES="Sona pour Windows $VERSION — installateur (Sona-Setup), version portable (Sona-Portable) et plugin Stream Deck. L'app se met à jour toute seule depuis cette page (latest.json)."
          if ! gh release view windows --repo "$REPO" >/dev/null 2>&1; then
            gh release create windows --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false --title "Sona pour Windows" --notes "$NOTES"
          else
            gh release edit windows --repo "$REPO" --notes "$NOTES"
          fi
          gh release upload windows "${FILES[@]}" --repo "$REPO" --clobber
          # Les fichiers des versions précédentes s'en vont.
          for asset in $(gh release view windows --repo "$REPO" --json assets --jq '.assets[].name'); do
            keep=0
            for f in "${FILES[@]}"; do [ "$asset" = "$(basename "$f")" ] && keep=1; done
            [ $keep = 1 ] || gh release delete-asset windows "$asset" --repo "$REPO" --yes
          done
