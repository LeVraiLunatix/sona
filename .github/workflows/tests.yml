name: Tests

# Sur chaque proposition de fusion et sur master, plus un appel depuis le
# workflow de déploiement : c'est ce dernier qui garantit qu'on ne déploie
# jamais un master rouge.
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  # Une nouvelle version d'une branche rend la précédente sans intérêt.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que le VPS : une incompatibilité de syntaxe doit
          # échouer ici, pas au redémarrage de PM2.
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Lancer les tests
        run: python -m pytest -q
