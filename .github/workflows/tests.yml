name: Tests

# Sur chaque proposition de fusion et sur master, plus un appel depuis le
# workflow de déploiement : c'est ce dernier qui garantit qu'on ne déploie
# jamais un master rouge.
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  # Une nouvelle version d'une branche rend la précédente sans intérêt.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que le VPS : une incompatibilité de syntaxe doit
          # échouer ici, pas au redémarrage de PM2.
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Lancer les tests
        run: python -m pytest -q

  # Comptes (service Rust) : migrations SQL, RLS, tests HTTP, Last.fm, passkeys… sur un vrai Postgres.
  rust:
    name: rust (sona-accounts)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONA_REQUIRE_DB: "1"   # sans base, les tests échouent au lieu d'être ignorés
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Démarrer un Postgres jetable
        run: |
          eval "$(scripts/test-postgres.sh start)"
          echo "SONA_TEST_DATABASE_URL=$SONA_TEST_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Tests
        working-directory: rust
        run: cargo test --workspace

  # Interface (navigateur réel, faux Supabase) : connexion, bienvenue, sanctions, amis, admin, menu latéral.
  ui:
    name: interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Tests d'interface
        run: node tests/ui/accounts.mjs
