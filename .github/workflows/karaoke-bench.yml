name: Banc karaoké (temporaire)

# Mesure du temps de séparation voix / instru sur un processeur ARM, proche
# du serveur Oracle (2 cœurs). Supprimé une fois la mesure faite.
on:
  push:
    branches: [claude/eloquent-ptolemy-qa8sle]
    paths:
      - ".github/workflows/karaoke-bench.yml"
      - "app/services/separation.py"

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install numpy onnxruntime
          lscpu | grep -E "Model name|^CPU\(s\)|Vendor"
          python -c "import onnxruntime, numpy; print(onnxruntime.__version__, numpy.__version__)"
      - name: Préparer
        run: |
          mkdir -p bench
          curl -sSL -o bench/model.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_4.onnx
          curl -sSL -o bench/mardy.flac https://raw.githubusercontent.com/nomadkaraoke/python-audio-separator/main/tests/inputs/mardy20s.flac
          ffmpeg -v error -y -stream_loop 8 -i bench/mardy.flac -t 180 -c:a aac -b:a 192k bench/song.m4a
      - name: Séparer 3 min sur 2 cœurs
        run: |
          start=$(date +%s)
          /usr/bin/time -v taskset -c 0,1 nice -n 19 python -m app.services.separation bench/song.m4a bench/v.m4a bench/i.m4a --model bench/model.onnx --threads 2 2> bench/time.txt | tail -1
          echo "Durée : $(( $(date +%s) - start )) s"
          grep -E "Elapsed|Maximum resident" bench/time.txt
          ls -la bench
