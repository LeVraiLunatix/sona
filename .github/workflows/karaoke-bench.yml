name: Banc karaoké (temporaire)

# Mesure du temps de séparation sur un processeur ARM (2 cœurs), proche du
# serveur Oracle. Supprimé une fois la mesure faite.
on:
  push:
    branches: [claude/eloquent-ptolemy-qa8sle]
    paths:
      - ".github/workflows/karaoke-bench.yml"

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      matrix:
        model: [UVR_MDXNET_9482, UVR-MDX-NET-Inst_HQ_4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install numpy onnxruntime
      - name: Préparer
        run: |
          mkdir -p bench
          curl -sSL -o bench/model.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/${{ matrix.model }}.onnx
          curl -sSL -o bench/mardy.flac https://raw.githubusercontent.com/nomadkaraoke/python-audio-separator/main/tests/inputs/mardy20s.flac
          ffmpeg -v error -y -stream_loop 8 -i bench/mardy.flac -t 180 -c:a aac -b:a 192k bench/song.m4a
      - name: Séparer 3 min sur 2 cœurs
        run: |
          spec=$([ "${{ matrix.model }}" = "UVR_MDXNET_9482" ] && echo fast || echo hq)
          python - <<PY
          import sys
          from app.services import separation
          print("modèles connus :", sorted(separation.MODELS))
          PY
          start=$(date +%s)
          /usr/bin/time -v taskset -c 0,1 nice -n 19 python -m app.services.separation bench/song.m4a bench/v.m4a bench/i.m4a --model bench/model.onnx --spec $spec --threads 2 2> bench/time.txt | tail -1
          echo "Durée ${{ matrix.model }} : $(( $(date +%s) - start )) s"
          grep -E "Elapsed|Maximum resident" bench/time.txt
          cat bench/time.txt | grep -i erreur || true
