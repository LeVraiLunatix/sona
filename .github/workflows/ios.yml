name: iOS

# Seulement quand l'app iOS bouge : c'est un projet à part (Swift/Xcode) qui
# n'a rien à voir avec le bot/l'API Python, pas la peine de ralentir chaque
# proposition de fusion avec un runner macOS pour ça. Sert surtout à
# compiler ce qui a été écrit sans accès à un Mac.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Un seul job macOS : la compilation pour appareil vérifie déjà que tout
  # compile. Sur un dépôt privé, chaque minute macOS compte pour 10 dans le
  # quota gratuit d'Actions — l'ancien job « simulateur » en doublon le
  # vidait deux fois plus vite.
  ipa:
    name: ipa (sideload)
    runs-on: macos-latest
    timeout-minutes: 30
    # Publication des versions (SideStore) sur master : créer une release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios/Encre
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Injecter la config serveur
        # Réécrit `BuildSecrets.swift` (suivi par Git avec des valeurs vides,
        # voir ce fichier) dans CE checkout éphémère uniquement, à partir de
        # secrets GitHub Actions chiffrés — jamais commité en clair. L'app
        # installée depuis l'.ipa produit ici est donc déjà connectée au
        # serveur sans rien saisir, sans que le jeton n'apparaisse jamais dans
        # l'historique Git.
        # Seule l'adresse du serveur est injectée : depuis la connexion
        # Last.fm, chacun se connecte avec son compte (validé par un admin).
        # Le jeton administrateur (API_TOKEN) n'est plus embarqué — sinon
        # toute personne à qui l'on passe l'.ipa aurait l'accès admin.
        env:
          IOS_API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
        run: |
          cat > Sources/Networking/BuildSecrets.swift <<EOF
          import Foundation

          enum BuildSecrets {
              static let apiBaseURL = "${IOS_API_BASE_URL}"
              static let apiToken = ""
          }
          EOF

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler pour appareil, sans signature
        # Pas de compte développeur Apple ici : on désactive entièrement la
        # signature (`CODE_SIGNING_ALLOWED=NO`, `CODE_SIGN_IDENTITY=""`) et on
        # laisse l'app non signée. C'est le format attendu par Sideloadly /
        # AltStore, qui re-signent eux-mêmes avec un identifiant Apple lors de
        # l'installation — inutile (et impossible sans compte payant) de
        # signer quoi que ce soit côté CI.
        run: |
          set -o pipefail
          xcodebuild build \
            -project Encre.xcodeproj \
            -scheme Encre \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Empaqueter en .ipa
        # Un .ipa est juste une archive zip contenant Payload/<App>.app :
        # aucun outil de signature nécessaire pour la construire, Sideloadly
        # ouvre ce zip directement.
        run: |
          set -e
          cd build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -r Encre.app Payload/
          zip -qr Sona.ipa Payload
          mv Sona.ipa "$GITHUB_WORKSPACE/Sona.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Sona-ipa
          path: Sona.ipa
          retention-days: 14

      - name: Publier la version (SideStore)
        # Sur master seulement : une release par version, avec l'.ipa et la
        # « source » SideStore/AltStore. Ajoutée une fois dans SideStore
        # (adresse fixe : …/releases/latest/download/source.json), elle y fait
        # apparaître chaque nouvelle version — mise à jour en un geste, sans PC.
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          TAG="build-$RUN"
          export SIZE=$(stat -f%z Sona.ipa)
          python3 - <<'PY'
          import datetime, json, os
          run, repo, size = os.environ["RUN"], os.environ["REPO"], int(os.environ["SIZE"])
          notes = (os.environ.get("MESSAGE") or "Nouvelle version").split("\n")[0][:200]
          base = f"https://github.com/{repo}"
          source = {
              "name": "Sona",
              "identifier": "com.sona.encre.source",
              "sourceURL": f"{base}/releases/latest/download/source.json",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/master/ios/Encre/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "apps": [{
                  "name": "Sona",
                  "bundleIdentifier": "com.sona.encre",
                  "developerName": "Sona",
                  "subtitle": "Ta musique, tes amis, tes stats.",
                  "localizedDescription": "Sona : écoute, playlists, stats, blind tests et écoute ensemble entre amis.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/master/ios/Encre/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
                  "tintColor": "8B5CF6",
                  "versions": [{
                      "version": f"1.0.{run}",
                      "buildVersion": run,
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": notes,
                      "downloadURL": f"{base}/releases/download/build-{run}/Sona.ipa",
                      "size": size,
                      "minOSVersion": "26.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          json.dump(source, open("source.json", "w"), ensure_ascii=False, indent=2)
          PY
          gh release create "$TAG" Sona.ipa source.json --repo "$REPO" --title "Sona 1.0.$RUN" --notes "$(printf '%s' "$MESSAGE" | head -n 1)" --latest
          # Garde les 5 dernières versions.
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 | while read -r old; do
            gh release delete "$old" --repo "$REPO" --yes --cleanup-tag || true
          done

