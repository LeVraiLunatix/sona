name: iOS

# Seulement quand l'app iOS bouge : c'est un projet à part (Swift/Xcode) qui
# n'a rien à voir avec le bot/l'API Python, pas la peine de ralentir chaque
# proposition de fusion avec un runner macOS pour ça. Sert surtout à
# compiler ce qui a été écrit sans accès à un Mac.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/Encre
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (SDK simulateur, sans signature)
        # `generic/platform=iOS Simulator` compile sans lancer un simulateur
        # précis : évite de dépendre d'une version de runtime disponible sur
        # le runner. Pas de tests ici, juste vérifier que ça compile — il n'y
        # a pas encore de cible de tests XCTest dans le projet.
        run: |
          set -o pipefail
          xcodebuild build \
            -project Encre.xcodeproj \
            -scheme Encre \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    name: ipa (sideload)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/Encre
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Injecter la config serveur
        # Réécrit `BuildSecrets.swift` (suivi par Git avec des valeurs vides,
        # voir ce fichier) dans CE checkout éphémère uniquement, à partir de
        # secrets GitHub Actions chiffrés — jamais commité en clair. L'app
        # installée depuis l'.ipa produit ici est donc déjà connectée au
        # serveur sans rien saisir, sans que le jeton n'apparaisse jamais dans
        # l'historique Git.
        env:
          IOS_API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
          IOS_API_TOKEN: ${{ secrets.IOS_API_TOKEN }}
        run: |
          cat > Sources/Networking/BuildSecrets.swift <<EOF
          import Foundation

          enum BuildSecrets {
              static let apiBaseURL = "${IOS_API_BASE_URL}"
              static let apiToken = "${IOS_API_TOKEN}"
          }
          EOF

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler pour appareil, sans signature
        # Pas de compte développeur Apple ici : on désactive entièrement la
        # signature (`CODE_SIGNING_ALLOWED=NO`, `CODE_SIGN_IDENTITY=""`) et on
        # laisse l'app non signée. C'est le format attendu par Sideloadly /
        # AltStore, qui re-signent eux-mêmes avec un identifiant Apple lors de
        # l'installation — inutile (et impossible sans compte payant) de
        # signer quoi que ce soit côté CI.
        run: |
          set -o pipefail
          xcodebuild build \
            -project Encre.xcodeproj \
            -scheme Encre \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Empaqueter en .ipa
        # Un .ipa est juste une archive zip contenant Payload/<App>.app :
        # aucun outil de signature nécessaire pour la construire, Sideloadly
        # ouvre ce zip directement.
        run: |
          set -e
          cd build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -r Encre.app Payload/
          zip -qr Encre.ipa Payload
          mv Encre.ipa "$GITHUB_WORKSPACE/Encre.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Encre-ipa
          path: Encre.ipa
          retention-days: 14
