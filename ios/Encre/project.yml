name: Encre
options:
  bundleIdPrefix: com.sona
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
targets:
  Encre:
    type: application
    platform: iOS
    # Le catalogue d'assets (icône, logo de lancement, couleurs) se déclare
    # dans `sources` : XcodeGen range lui-même les .xcassets en ressources.
    # Une clé `resources:` n'existe pas pour une cible et était ignorée en
    # silence — l'app partait sans icône.
    sources:
      - path: Sources
      - path: Assets.xcassets
    # Widgets et Live Activity (voir Widgets/), intégrés à l'app.
    dependencies:
      - target: SonaWidgets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sona
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # L'API Sona tourne en local (voir README du dépôt principal, section
        # « API ») : sur le même Wi-Fi que le serveur, l'app y accède en HTTP
        # simple tant qu'aucun reverse proxy HTTPS n'est en place.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Lecture en fond + écran verrouillé (MPNowPlayingInfoCenter /
        # MPRemoteCommandCenter, voir PlayerManager) : sans ce mode, iOS coupe
        # l'audio dès que l'app passe en arrière-plan ou que l'écran se verrouille.
        UIBackgroundModes:
          - audio
          # Téléchargements intelligents la nuit (Wi-Fi + en charge).
          - processing
          # Vérifier de temps en temps si un ami lance une partie (notifications).
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.sona.encre.smart-downloads
          - com.sona.encre.refresh
        # Concerts près de chez toi (distance aux salles, jamais envoyée).
        NSLocationWhenInUseUsageDescription: Sona trie les concerts de tes artistes selon leur distance et place tes écoutes sur ta carte (à 1 km près).
        # Import d'une playlist depuis la bibliothèque Musique de l'iPhone
        # (liste complète, là où la page web d'Apple Music s'arrête à 300).
        NSAppleMusicUsageDescription: Sona lit tes playlists Musique pour les importer en entier.
        # Mode sport (cadence de course) et gestes de la tête avec les AirPods.
        NSMotionUsageDescription: Sona suit ta foulée en mode sport et reconnaît les gestes de la tête avec tes AirPods.
        # Live Activity de l'écoute ensemble (écran verrouillé, Dynamic Island).
        NSSupportsLiveActivities: true
        # Liens `encre://` : ouverture depuis les widgets (blind test, récap…).
        CFBundleURLTypes:
          - CFBundleURLName: com.sona.encre
            CFBundleURLSchemes:
              - encre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sona.encre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SonaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Shared
      - path: Sources/DesignSystem/SonaLogoGeometry.swift
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Sona
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sona.encre.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

