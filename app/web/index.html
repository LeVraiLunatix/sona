<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --surface: rgba(255,255,255,.07); --surface2: rgba(255,255,255,.12);
    --text: #fff; --text2: rgba(255,255,255,.6); --text3: rgba(255,255,255,.35); --accent: #8b5cf6; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; }
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr 88px; height: 100vh; }
  nav { grid-row: 1; padding: 24px 14px; border-right: 1px solid rgba(255,255,255,.06); }
  nav .logo { font-weight: 800; font-size: 26px; padding: 0 10px 22px; letter-spacing: -.5px; }
  nav button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border-radius: 10px; color: var(--text2); font-weight: 600; }
  nav button.active, nav button:hover { background: var(--surface); color: var(--text); }
  main { grid-row: 1; overflow-y: auto; padding: 28px 32px 40px; }
  h1 { font-size: 32px; margin: 0 0 22px; letter-spacing: -.5px; }
  h2 { font-size: 21px; margin: 32px 0 14px; }
  .row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px; }
  .tile { width: 170px; flex: none; text-align: left; }
  .tile img, .cover { width: 170px; height: 170px; border-radius: 10px; object-fit: cover; background: var(--surface); display: block; }
  .tile .t { font-weight: 600; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { color: var(--text2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list { display: flex; flex-direction: column; }
  .track { display: grid; grid-template-columns: 28px 44px 1fr auto 40px; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 10px; text-align: left; }
  .track:hover { background: var(--surface); }
  .track.current .ti { color: var(--accent); }
  .track img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface); }
  .track .n { color: var(--text3); font-size: 14px; text-align: right; }
  .track .ti { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .ar { color: var(--text2); font-size: 14px; }
  .track .d { color: var(--text3); font-size: 14px; }
  .search { width: 100%; max-width: 520px; padding: 13px 18px; border-radius: 999px; border: 0; background: var(--surface2); color: var(--text); outline: none; font-size: 16px; }
  .pill { padding: 10px 20px; border-radius: 999px; background: #fff; color: #000; font-weight: 700; }
  .pill.secondary { background: var(--surface2); color: var(--text); }
  .hero { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 20px; }
  .hero img { width: 220px; height: 220px; border-radius: 12px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,.6); background: var(--surface); }
  .muted { color: var(--text2); }
  .player { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; gap: 20px; padding: 0 20px; background: #0c0c0e; border-top: 1px solid rgba(255,255,255,.06); }
  .now { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .now img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--surface); }
  .now .ti { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .buttons { display: flex; gap: 22px; align-items: center; }
  .buttons .play { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
  .bar { display: flex; gap: 10px; align-items: center; width: 100%; font-size: 12px; color: var(--text3); }
  input[type=range] { accent-color: #fff; width: 100%; }
  .side { display: flex; gap: 14px; justify-content: flex-end; align-items: center; }
  .side input { max-width: 120px; }
  .icon { width: 22px; height: 22px; fill: currentColor; }
  .lyrics { max-width: 760px; font-size: 30px; font-weight: 800; line-height: 1.35; }
  .lyrics p { margin: 0 0 18px; color: var(--text3); transition: color .3s; cursor: pointer; }
  .lyrics p.on { color: #fff; }
  .login { display: grid; place-items: center; height: 100vh; text-align: center; }
  .login .logo { font-size: 56px; font-weight: 800; margin-bottom: 8px; }
  .error { color: var(--danger); margin-top: 14px; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 120px; }
    nav { grid-row: 1; display: flex; overflow-x: auto; border: 0; padding: 10px; }
    nav .logo { display: none; }
    nav button { width: auto; white-space: nowrap; }
    main { grid-row: 2; padding: 16px; }
    .player { grid-row: 3; grid-template-columns: 1fr; gap: 6px; padding: 8px 16px; }
    .side { display: none; }
    .track { grid-template-columns: 44px 1fr 32px; }
    .track .n, .track .d { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<audio id="audio" preload="auto"></audio>
<script>
/* Sona sur ordinateur : même compte, mêmes playlists, mêmes stats que l'app.
   Connexion Last.fm, puis tout passe par l'API (jeton de session gardé dans
   le navigateur). Le son vient du même flux que l'app. */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

let token = store.get("sona.token");
const audio = $("#audio");
const state = { view: "home", queue: [], index: -1, lyrics: null, listened: 0, lastTick: 0, scrobbled: false, liked: new Set() };

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json", ...(options.headers || {}) } });
  if (res.status === 401) { store.set("sona.token", null); token = null; render(); throw new Error("Session expirée"); }
  if (!res.ok) { let msg = `Erreur ${res.status}`; try { msg = (await res.json()).detail || msg; } catch {} throw new Error(msg); }
  return res.status === 204 ? null : res.json();
}

const icons = {
  home: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>',
  search: '<svg class="icon" viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>',
  list: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 5h14v2H3zm0 6h14v2H3zm0 6h9v2H3zm16-4v6.2A2.5 2.5 0 1 0 21 21.5V15h2v-2z"/></svg>',
  heart: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 21 3.5 12.6A5.3 5.3 0 0 1 12 5.7a5.3 5.3 0 0 1 8.5 6.9z"/></svg>',
  lyrics: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3zm3 4v2h10V8zm0 4v2h7v-2z"/></svg>',
  play: '<svg class="icon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  prev: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10 7V5z"/></svg>',
  next: '<svg class="icon" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>',
};

// -- Connexion ---------------------------------------------------------------

async function login() {
  const params = new URLSearchParams(location.search);
  const lastfmToken = params.get("token");
  if (lastfmToken) {
    history.replaceState(null, "", location.pathname);
    const res = await fetch("/auth/lastfm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: lastfmToken }) });
    const body = await res.json();
    if (res.ok) { token = body.session_token; store.set("sona.token", token); }
    else { return renderLogin(body.detail || "Connexion refusée."); }
  }
  if (!token) return renderLogin();
  try {
    const me = await api("/me");
    if (me.status !== "approved") return renderLogin("Ton compte attend la validation d'un administrateur.");
    render();
  } catch (e) { renderLogin(e.message); }
}

async function renderLogin(error) {
  const config = await fetch("/auth/config").then((r) => r.json()).catch(() => ({}));
  const cb = location.origin + location.pathname;
  const url = config.api_key ? `https://www.last.fm/api/auth/?api_key=${config.api_key}&cb=${encodeURIComponent(cb)}` : null;
  $("#root").innerHTML = `<div class="login"><div>
    <div class="logo">Sona</div><p class="muted">Ta musique, sur ton ordinateur.</p>
    ${url ? `<a class="pill" href="${url}" style="display:inline-block;text-decoration:none;margin-top:18px">Se connecter avec Last.fm</a>` : '<p class="error">Connexion Last.fm non configurée sur le serveur.</p>'}
    ${error ? `<p class="error">${esc(error)}</p>` : ""}
  </div></div>`;
}

// -- Vues --------------------------------------------------------------------

function render() {
  $("#root").innerHTML = `<div class="app">
    <nav>
      <div class="logo">Sona</div>
      ${[["home", "Écouter", icons.home], ["search", "Rechercher", icons.search], ["playlists", "Playlists", icons.list], ["library", "Bibliothèque", icons.heart], ["lyrics", "Paroles", icons.lyrics]]
        .map(([id, label, icon]) => `<button data-view="${id}" class="${state.view === id ? "active" : ""}">${icon}${label}</button>`).join("")}
    </nav>
    <main id="main"></main>
    <div class="player" id="player"></div>
  </div>`;
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { state.view = b.dataset.view; render(); });
  renderPlayer();
  ({ home: viewHome, search: viewSearch, playlists: viewPlaylists, library: viewLibrary, lyrics: viewLyrics }[state.view] || viewHome)();
}

function trackList(tracks, name) {
  const current = state.queue[state.index];
  return `<div class="list">${tracks.map((t, i) => `
    <button class="track ${current && current.source === t.source && current.source_id === t.source_id ? "current" : ""}" data-i="${i}">
      <span class="n">${i + 1}</span><img src="${esc(t.cover_url || "")}" alt="" loading="lazy">
      <span style="min-width:0"><div class="ti">${esc(t.title)}</div><div class="ar">${esc(t.artist)}</div></span>
      <span class="d">${t.duration_seconds ? fmt(t.duration_seconds) : ""}</span>
      <span class="like" data-like="${i}" title="Ajouter à la bibliothèque">${icons.heart}</span>
    </button>`).join("")}</div>`;
}

function bindTracks(el, tracks, name) {
  el.querySelectorAll(".track").forEach((b) => b.onclick = (e) => {
    const like = e.target.closest("[data-like]");
    if (like) { e.stopPropagation(); likeTrack(tracks[+like.dataset.like]); like.style.color = "var(--accent)"; return; }
    playList(tracks, +b.dataset.i, name);
  });
}

function tiles(items, onClick) {
  return `<div class="row">${items.map((it, i) => `<button class="tile" data-i="${i}">
    <img src="${esc(it.cover || "")}" alt="" loading="lazy"><div class="t">${esc(it.title)}</div><div class="s">${esc(it.subtitle || "")}</div></button>`).join("")}</div>`;
}

async function viewHome() {
  const main = $("#main");
  main.innerHTML = `<h1>Écouter</h1><p class="muted">Chargement…</p>`;
  const [mixes, recent, releases] = await Promise.all([
    api("/home/mixes").catch(() => []), api("/plays/recent?limit=30").catch(() => []), api("/releases").catch(() => []),
  ]);
  const recentTracks = recent.filter((p) => p.source && p.source_id).map((p) => ({ ...p }));
  main.innerHTML = `<h1>Écouter</h1>
    ${mixes.length ? `<h2>Faits pour toi</h2>${tiles(mixes.map((m) => ({ title: m.title, subtitle: m.subtitle, cover: m.covers[0] })))}` : ""}
    ${releases.length ? `<h2>Nouvelles sorties</h2><div id="rel">${tiles(releases.map((r) => ({ title: r.title, subtitle: `${r.artist} · ${r.kind}`, cover: r.cover_url })))}</div>` : ""}
    ${recentTracks.length ? `<h2>Écouté récemment</h2><div id="recent">${trackList(recentTracks.slice(0, 15))}</div>` : ""}`;
  main.querySelectorAll(".row")[0]?.querySelectorAll(".tile").forEach((b) => b.onclick = () => {
    const mix = mixes[+b.dataset.i]; playList(mix.tracks, 0, mix.title);
  });
  if ($("#recent")) bindTracks($("#recent"), recentTracks.slice(0, 15), "Écouté récemment");
}

async function viewSearch() {
  const main = $("#main");
  main.innerHTML = `<h1>Rechercher</h1><input class="search" id="q" placeholder="Titre, artiste…" autofocus><div id="results" style="margin-top:20px"></div>`;
  let timer;
  $("#q").oninput = (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    timer = setTimeout(async () => {
      if (!q) { $("#results").innerHTML = ""; return; }
      try {
        const res = await api(`/search?q=${encodeURIComponent(q)}&limit=30`);
        $("#results").innerHTML = trackList(res.tracks);
        bindTracks($("#results"), res.tracks, `Recherche « ${q} »`);
      } catch (err) { $("#results").innerHTML = `<p class="error">${esc(err.message)}</p>`; }
    }, 300);
  };
}

async function viewPlaylists() {
  const main = $("#main");
  main.innerHTML = `<h1>Playlists</h1><p class="muted">Chargement…</p>`;
  const [playlists, smart] = await Promise.all([api("/me/playlists").catch(() => []), api("/smart").catch(() => [])]);
  main.innerHTML = `<h1>Playlists</h1>
    ${smart.length ? `<h2>Intelligentes</h2><div id="smart">${tiles(smart.map((s) => ({ title: s.title, subtitle: `${s.count} titres`, cover: s.covers[0] })))}</div>` : ""}
    <h2>Tes playlists</h2><div id="mine">${tiles(playlists.map((p) => ({ title: p.name, subtitle: `${p.track_count} titres`, cover: p.cover_url || (p.covers || [])[0] })))}</div>`;
  $("#smart")?.querySelectorAll(".tile").forEach((b) => b.onclick = async () => {
    const s = smart[+b.dataset.i];
    showTracks(s.title, s.subtitle, s.covers[0], await api(`/smart/${s.id}`));
  });
  $("#mine").querySelectorAll(".tile").forEach((b) => b.onclick = async () => {
    const p = playlists[+b.dataset.i];
    const detail = await api(`/me/playlists/${p.id}`);
    showTracks(detail.name, `${detail.track_count} titres`, detail.cover_url || (detail.covers || [])[0], (detail.entries || []).map((e) => e.track || e));
  });
}

function showTracks(title, subtitle, cover, tracks) {
  const main = $("#main");
  main.innerHTML = `<div class="hero"><img src="${esc(cover || "")}" alt=""><div>
    <h1 style="margin:0 0 6px">${esc(title)}</h1><p class="muted" style="margin:0 0 16px">${esc(subtitle || "")}</p>
    <button class="pill" id="playall">Lecture</button> <button class="pill secondary" id="shuffle">Aléatoire</button></div></div>
    <div id="tl">${trackList(tracks)}</div>`;
  $("#playall").onclick = () => playList(tracks, 0, title);
  $("#shuffle").onclick = () => playList([...tracks].sort(() => Math.random() - .5), 0, title);
  bindTracks($("#tl"), tracks, title);
}

async function viewLibrary() {
  const main = $("#main");
  main.innerHTML = `<h1>Bibliothèque</h1><p class="muted">Chargement…</p>`;
  const page = await api("/library/track?limit=500").catch(() => ({ items: [] }));
  const tracks = (page.items || []).map((i) => i.track || i).filter((t) => t.source_id);
  showTracks("Tes titres", `${tracks.length} titres`, tracks[0]?.cover_url, tracks);
}

function viewLyrics() {
  const main = $("#main");
  const t = state.queue[state.index];
  if (!t) { main.innerHTML = `<h1>Paroles</h1><p class="muted">Lance un titre pour voir ses paroles.</p>`; return; }
  if (!state.lyrics || state.lyrics.id !== t.source_id) {
    main.innerHTML = `<h1>${esc(t.title)}</h1><p class="muted">Chargement des paroles…</p>`;
    loadLyrics(t).then(() => state.view === "lyrics" && viewLyrics());
    return;
  }
  const lines = state.lyrics.lines;
  main.innerHTML = `<h1>${esc(t.title)} <span class="muted" style="font-weight:500">· ${esc(t.artist)}</span></h1>
    <div class="lyrics" id="lyr">${lines.length ? lines.map((l, i) => `<p data-i="${i}">${esc(l.text || "♪")}</p>`).join("") : '<p>Pas de paroles connues pour ce titre.</p>'}</div>`;
  $("#lyr").querySelectorAll("p[data-i]").forEach((p) => p.onclick = () => {
    const time = lines[+p.dataset.i].time; if (time != null) audio.currentTime = time;
  });
  syncLyrics(true);
}

async function loadLyrics(t) {
  const q = new URLSearchParams({ title: t.title, artist: t.artist });
  if (t.duration_seconds) q.set("duration", t.duration_seconds);
  const lyrics = await api(`/lyrics?${q}`).catch(() => null);
  state.lyrics = { id: t.source_id, lines: lyrics?.lines || [], synced: lyrics?.synced };
}

function syncLyrics(force) {
  if (state.view !== "lyrics" || !state.lyrics?.synced) return;
  const lines = state.lyrics.lines, now = audio.currentTime + 0.3;
  let active = -1;
  lines.forEach((l, i) => { if (l.time != null && l.time <= now) active = i; });
  const el = $("#lyr"); if (!el) return;
  el.querySelectorAll("p").forEach((p) => p.classList.toggle("on", +p.dataset.i === active));
  const on = el.querySelector("p.on");
  if (on && (force || on.dataset.i !== state.lastLyric)) { state.lastLyric = on.dataset.i; on.scrollIntoView({ block: "center", behavior: "smooth" }); }
}

// -- Lecture -----------------------------------------------------------------

function playList(tracks, index, name) {
  state.queue = tracks; state.name = name;
  playAt(index);
}

function playAt(index) {
  const t = state.queue[index];
  if (!t) return;
  state.index = index; state.listened = 0; state.lastTick = 0; state.scrobbled = false; state.lyrics = null;
  audio.src = `/stream/${encodeURIComponent(t.source)}/${encodeURIComponent(t.source_id)}?token=${encodeURIComponent(token)}`;
  audio.play().catch(() => {});
  api("/plays/now", { method: "POST", body: JSON.stringify({ title: t.title, artist: t.artist, album: t.album, duration_seconds: t.duration_seconds, source: t.source, source_id: t.source_id, cover_url: t.cover_url }) }).catch(() => {});
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || "", artwork: t.cover_url ? [{ src: t.cover_url, sizes: "512x512" }] : [] });
  }
  state.startedAt = new Date().toISOString();
  document.title = `${t.title} · ${t.artist} — Sona`;
  if (state.view === "lyrics") viewLyrics();
  renderPlayer();
  document.querySelectorAll(".track.current").forEach((el) => el.classList.remove("current"));
}

function renderPlayer() {
  const el = $("#player"); if (!el) return;
  const t = state.queue[state.index];
  el.innerHTML = `
    <div class="now">${t ? `<img src="${esc(t.cover_url || "")}" alt=""><div style="min-width:0"><div class="ti">${esc(t.title)}</div><div class="muted" style="font-size:14px">${esc(t.artist)}</div></div>` : '<span class="muted">Rien en lecture</span>'}</div>
    <div class="controls">
      <div class="buttons"><button id="prev">${icons.prev}</button><button class="play" id="toggle">${audio.paused ? icons.play : icons.pause}</button><button id="next">${icons.next}</button></div>
      <div class="bar"><span id="cur">${fmt(audio.currentTime)}</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">${fmt(audio.duration || t?.duration_seconds)}</span></div>
    </div>
    <div class="side">🔈<input type="range" id="vol" min="0" max="1" step="0.01" value="${audio.volume}"></div>`;
  $("#toggle").onclick = () => audio.paused ? audio.play() : audio.pause();
  $("#prev").onclick = () => audio.currentTime > 3 ? (audio.currentTime = 0) : playAt(Math.max(0, state.index - 1));
  $("#next").onclick = () => playAt(state.index + 1);
  $("#seek").oninput = (e) => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
  $("#vol").oninput = (e) => { audio.volume = +e.target.value; store.set("sona.volume", e.target.value); };
}

async function likeTrack(t) {
  try { await api("/library/track", { method: "POST", body: JSON.stringify({ source: t.source, source_id: t.source_id }) }); } catch {}
}

audio.volume = +(store.get("sona.volume") || 1);
audio.addEventListener("play", () => $("#toggle") && ($("#toggle").innerHTML = icons.pause));
audio.addEventListener("pause", () => $("#toggle") && ($("#toggle").innerHTML = icons.play));
audio.addEventListener("ended", () => playAt(state.index + 1));
audio.addEventListener("timeupdate", () => {
  const cur = audio.currentTime, dur = audio.duration || state.queue[state.index]?.duration_seconds || 0;
  if ($("#cur")) $("#cur").textContent = fmt(cur);
  if ($("#dur")) $("#dur").textContent = fmt(dur);
  if ($("#seek") && dur) $("#seek").value = Math.round(cur / dur * 1000);
  const delta = cur - state.lastTick; state.lastTick = cur;
  if (!audio.paused && delta > 0 && delta < 1.5) state.listened += delta;
  // Même règle que l'app : écoute comptée à la moitié du titre ou 4 min.
  const t = state.queue[state.index];
  if (t && !state.scrobbled && dur > 30 && state.listened >= Math.min(dur / 2, 240)) {
    state.scrobbled = true;
    api("/plays", { method: "POST", body: JSON.stringify({ plays: [{ title: t.title, artist: t.artist, album: t.album, source: t.source, source_id: t.source_id, artist_source_id: t.artist_source_id, album_source_id: t.album_source_id, cover_url: t.cover_url, duration_seconds: Math.round(dur), listened_seconds: Math.round(state.listened), played_at: state.startedAt }] }) }).catch(() => {});
  }
  syncLyrics(false);
});
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("nexttrack", () => playAt(state.index + 1));
  navigator.mediaSession.setActionHandler("previoustrack", () => playAt(Math.max(0, state.index - 1)));
}
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});

login();
</script>
