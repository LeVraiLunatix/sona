<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430, initial-scale=1">
<title>Lecteur Sona iOS (réplique)</title>
<!-- Réplique, en page web déterministe, du lecteur plein écran de l'app iOS (ios/Encre/Sources/Features/Player/FullPlayerView.swift) :
     fond vivant en maillage 4×4 aux couleurs de la pochette, pochette immersive qui se fond dedans, barre de progression, boutons.
     Piloté par window.setT(tempsDuMorceau) : chaque image est exactement reproductible. -->
<style>
:root { --font: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 430px; height: 932px; background: #000; overflow: hidden; }
body { font-family: var(--font); color: #fff; -webkit-font-smoothing: antialiased; position: relative; }
#bg { position: absolute; inset: 0; width: 430px; height: 932px; transform-origin: 50% 50%; }
#veil { position: absolute; inset: 0; background: #000; }
#art { position: absolute; left: 0; top: 0; width: 430px; height: 495px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 60%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 60%, transparent 100%); }
#art img { position: absolute; left: 0; top: -2.5px; width: 430px; height: 500px; object-fit: cover; will-change: transform; }
#art::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 150px; background: linear-gradient(to bottom, rgba(0, 0, 0, .45), transparent); }
.abs { position: absolute; }
#status { position: absolute; left: 0; top: 0; width: 430px; height: 54px; }
#status .time { position: absolute; left: 50px; top: 19px; font: 600 17px/1 var(--font); letter-spacing: -.2px; }
#island { position: absolute; left: 152px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000; }
#status svg { position: absolute; right: 30px; top: 21px; }
#top .chev { position: absolute; left: 26px; top: 67px; width: 40px; height: 40px; display: grid; place-items: center; }
#top .grab { position: absolute; left: 196px; top: 82px; width: 38px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .35); }
#top .more { position: absolute; left: 364px; top: 67px; width: 40px; height: 40px; display: grid; place-items: center; }
#top .more i { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: grid; place-items: center; }
#title { position: absolute; left: 26px; right: 26px; top: 556px; height: 60px; }
#title b { display: block; font: 700 22px/26px var(--font); letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
#title span { display: block; margin-top: 3px; font: 400 19px/24px var(--font); color: rgba(255, 255, 255, .6); white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
#title .heart { position: absolute; right: 0; top: 10px; width: 40px; height: 40px; display: grid; place-items: center; }
#scrub { position: absolute; left: 26px; width: 378px; top: 634px; height: 46px; }
#scrub .bar { position: absolute; left: 0; top: 9px; width: 378px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .2); }
#scrub .bar i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; background: rgba(255, 255, 255, .75); }
#scrub .t { position: absolute; top: 32px; font: 500 12px/14px var(--font); font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .35); }
#transport svg { position: absolute; }
#vol { position: absolute; left: 26px; width: 378px; top: 808px; height: 30px; }
#vol .track { position: absolute; left: 24px; right: 24px; top: 13px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); }
#vol .track i { position: absolute; left: 0; top: 0; height: 100%; width: 68%; border-radius: 2px; background: rgba(255, 255, 255, .72); }
#vol svg { position: absolute; top: 9px; }
#bottom svg { position: absolute; }
/* vue paroles (compactPanel + LyricsView) */
#lyview { display: none; }
.v-lyrics #lyview { display: block; }
.bare #status, .bare #top, .bare #lyview .head { display: none; }
.bare #ly { top: 0; height: 932px; }
.v-lyrics #art, .v-lyrics #title, .v-lyrics #scrub, .v-lyrics #transport, .v-lyrics #vol, .v-lyrics #bottom { display: none; }
#lyview .head { position: absolute; left: 26px; right: 26px; top: 121px; height: 62px; }
#lyview .head img { position: absolute; left: 0; top: 0; width: 62px; height: 62px; border-radius: 8px; object-fit: cover; box-shadow: 0 5px 10px rgba(0, 0, 0, .3); }
#lyview .head b { position: absolute; left: 76px; top: 10px; max-width: 250px; font: 700 17px/21px var(--font); letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lyview .head span { position: absolute; left: 76px; top: 33px; font: 400 15px/19px var(--font); color: rgba(255, 255, 255, .6); }
#lyview .head svg { position: absolute; right: 0; top: 19px; }
#ly { position: absolute; left: 0; top: 206px; width: 430px; height: 690px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 9%, #000 88%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 9%, #000 88%, transparent); }
#ly .track { position: absolute; left: 0; right: 0; top: 0; padding: 0 26px; }
#ly p { font: 700 28px/34px var(--font); letter-spacing: -.3px; margin: 0 0 24px; transform-origin: 0 50%; }
#ly .w { display: inline-block; white-space: pre-wrap; color: transparent; -webkit-background-clip: text; background-clip: text; transform-origin: 50% 85%;
  background-image: linear-gradient(90deg, rgba(255, 255, 255, var(--a1, .35)) calc(var(--p, 0) * 116% - 8%), rgba(255, 255, 255, var(--a2, .35)) calc(var(--p, 0) * 116% + 8%)); }
</style>
</head>
<body>
<canvas id="bg" width="86" height="187"></canvas>
<div id="veil"></div>
<div id="art"><img id="cover" alt=""></div>

<div id="status">
  <span class="time">9:41</span><div id="island"></div>
  <svg width="68" height="14" viewBox="0 0 68 14" fill="#fff"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/>
    <path d="M30 11.2a1.6 1.6 0 1 1 0 .01zM24.6 7.6a7.6 7.6 0 0 1 10.8 0M27 9.8a4.2 4.2 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <rect x="43" y="1" width="23" height="12" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="44.8" y="2.8" width="17" height="8.4" rx="2.2"/><rect x="67" y="5" width="1.4" height="4" rx=".7" fill-opacity=".45"/></svg>
</div>

<div id="top">
  <div class="chev"><svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3l8.5 8 8.5-8"/></svg></div>
  <div class="grab"></div>
  <div class="more"><i><svg width="16" height="4" viewBox="0 0 16 4" fill="#fff"><circle cx="2" cy="2" r="1.7"/><circle cx="8" cy="2" r="1.7"/><circle cx="14" cy="2" r="1.7"/></svg></i></div>
</div>

<div id="title"><b id="t-title"></b><span id="t-artist"></span>
  <div class="heart"><svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.2C5.5 15.6 2 12.2 2 7.9 2 5 4.2 3 6.9 3c1.9 0 3.7 1 5.1 3 1.4-2 3.2-3 5.1-3C19.8 3 22 5 22 7.9c0 4.3-3.5 7.7-10 12.3z"/></svg></div></div>

<div id="lyview"><div class="head"><img id="ly-art" alt=""><b id="ly-title"></b><span id="ly-artist"></span>
  <svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.2C5.5 15.6 2 12.2 2 7.9 2 5 4.2 3 6.9 3c1.9 0 3.7 1 5.1 3 1.4-2 3.2-3 5.1-3C19.8 3 22 5 22 7.9c0 4.3-3.5 7.7-10 12.3z"/></svg></div>
  <div id="ly"><div class="track"></div></div></div>

<div id="scrub"><div class="bar"><i id="fill"></i></div><span class="t" id="t-cur" style="left:0">0:00</span><span class="t" id="t-rem" style="right:0">-0:00</span></div>

<div id="transport">
  <!-- backward.fill / pause.fill / forward.fill : gros symboles nus (30 / 46 / 30 pt) -->
  <svg style="left:81px;top:732px" width="37" height="24" viewBox="0 0 37 24" fill="#fff"><path d="M18 12L35 1.2v21.6zM1.5 12L18.5 1.2v21.6z" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="0" y="1" width="3" height="22" rx="1.4" opacity="0"/></svg>
  <svg style="left:196px;top:721px" width="38" height="46" viewBox="0 0 38 46" fill="#fff"><rect x="2" y="2" width="12.5" height="42" rx="3.4"/><rect x="23.5" y="2" width="12.5" height="42" rx="3.4"/></svg>
  <svg style="left:312px;top:732px" width="37" height="24" viewBox="0 0 37 24" fill="#fff"><path d="M19 12L2 1.2v21.6zM35.5 12L18.5 1.2v21.6z" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
</div>

<div id="vol">
  <svg style="left:0" width="14" height="12" viewBox="0 0 14 12" fill="rgba(255,255,255,.35)"><path d="M1 4h2.6L7.6.8v10.4L3.6 8H1z"/></svg>
  <div class="track"><i></i></div>
  <svg style="right:0;left:auto" width="22" height="12" viewBox="0 0 22 12" fill="rgba(255,255,255,.35)"><path d="M1 4h2.6L7.6.8v10.4L3.6 8H1z"/><path d="M10 3.4a3.8 3.8 0 0 1 0 5.2M12.6 1.2a7 7 0 0 1 0 9.6M15.2-.4a9.6 9.6 0 0 1 0 12.8" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round" transform="translate(1.6 0)"/></svg>
</div>

<div id="bottom">
  <!-- quote.bubble · airplayaudio · list.bullet -->
  <svg style="left:67px;top:862px" width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-5 4v-4H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M7 7.2h10M7 10.8h6.5"/></svg>
  <svg style="left:200px;top:861px" width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="2.4" fill="rgba(255,255,255,.6)"/><path d="M9.6 14.8a7.6 7.6 0 1 1 10.8 0M6.4 17.4a11.6 11.6 0 1 1 17.2 0"/><path d="M15 15.6l5.2 6.6H9.8z" fill="rgba(255,255,255,.6)"/></svg>
  <svg style="left:341px;top:864px" width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.2" stroke-linecap="round"><path d="M7.4 2.2H21M7.4 9H21M7.4 15.8H21"/><circle cx="2" cy="2.2" r="1.2" fill="rgba(255,255,255,.6)" stroke="none"/><circle cx="2" cy="9" r="1.2" fill="rgba(255,255,255,.6)" stroke="none"/><circle cx="2" cy="15.8" r="1.2" fill="rgba(255,255,255,.6)" stroke="none"/></svg>
</div>

<script>
const q = new URLSearchParams(location.search);
const COVER = q.get("cover"), TITLE = q.get("title") || "", ARTIST = q.get("artist") || "", BPM = +q.get("bpm") || 138, BEAT0 = +q.get("beat0") || 0, DUR = +q.get("dur") || 180;
const $ = (s) => document.querySelector(s);
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
$("#t-title").textContent = TITLE; $("#t-artist").textContent = ARTIST;

/* ───── palette de la pochette (ArtworkPalette.meshColors) : 16 cases HSB, un peu rapprochées de la couleur la plus vive ───── */
const rgb2hsb = ([r, g, b]) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; if (h < 0) h += 1; } return { h, s: mx ? d / mx : 0, b: mx }; };
const hsb2rgb = (h, s, v) => { const f = (n) => { const k = (n + h * 6) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5) * 255, f(3) * 255, f(1) * 255]; };
let PAL = null;
function palette(img) {
  const c = document.createElement("canvas"); c.width = c.height = 4; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, 4, 4);
  const d = x.getImageData(0, 0, 4, 4).data, cells = [];
  for (let i = 0; i < 16; i++) cells.push(rgb2hsb([d[i * 4], d[i * 4 + 1], d[i * 4 + 2]]));
  const vivid = cells.reduce((a, b) => (b.s * b.b > a.s * a.b ? b : a));
  return cells.map((c) => { let s = Math.min(1, c.s * 1.2), h = c.h; if (c.s < .25 && vivid.s > .35) { h = vivid.h; s = Math.max(s, vivid.s * .45); } return hsb2rgb(h, s, Math.min(Math.max(c.b, .14), .62)); });
}

/* ───── fond vivant : grille 4×4 dont les points dérivent (LivingBackground.points) ───── */
const bg = $("#bg"), bx = bg.getContext("2d"), BW = bg.width, BH = bg.height, img = bx.createImageData(BW, BH);
function points(t, energy) {
  const amp = .085 + .06 * energy, P = [];
  for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) {
    const seed = row * 4 + col; let x = col / 3, y = row / 3;
    if (col !== 0 && col !== 3) x += amp * Math.sin(t * (.21 + .031 * seed) + seed * 1.7);
    if (row !== 0 && row !== 3) y += amp * Math.cos(t * (.17 + .027 * seed) + seed * 2.3);
    P.push([x, y]);
  }
  return P;
}
function paintMesh(t, energy) {
  const P = points(t, energy), sig = .2, k = 1 / (2 * sig * sig), asp = 430 / 932;
  for (let j = 0; j < BH; j++) for (let i = 0; i < BW; i++) {
    const u = i / (BW - 1), v = j / (BH - 1); let r = 0, g = 0, b = 0, w = 0;
    for (let n = 0; n < 16; n++) { const dx = (u - P[n][0]) * asp, dy = v - P[n][1], wt = Math.exp(-(dx * dx + dy * dy) * k * 1.6); r += PAL[n][0] * wt; g += PAL[n][1] * wt; b += PAL[n][2] * wt; w += wt; }
    const o = (j * BW + i) * 4; img.data[o] = r / w; img.data[o + 1] = g / w; img.data[o + 2] = b / w; img.data[o + 3] = 255;
  }
  bx.putImageData(img, 0, 0);
}

/* ───── paroles : ligne active pleine, voisines floues et atténuées, mot qui se remplit (LyricsView) ───── */
const VIEW = q.get("view") || "player", BARE = q.has("bare"); document.body.className = "v-" + VIEW + (BARE ? " bare" : "");
const cl = (v) => Math.max(0, Math.min(1, v)), seg = (p, a, b) => cl((p - a) / (b - a)), ease = (t) => 1 - Math.pow(1 - t, 3), lerp = (a, b, t) => a + (b - a) * t;
let LY = null, LINES = [], CY = [];
async function loadLyrics() {
  if (VIEW !== "lyrics") return;
  const r = await fetch(q.get("lyrics")).then((x) => x.json()).catch(() => null); if (!r || !r.lines) return;
  const SHIFT = +q.get("shift") || 0;   // décalage des temps (démo : paroles de test recalées sur la position du clip)
  const lines = r.lines.filter((l) => l.text);
  if (SHIFT) lines.forEach((l) => { l.time += SHIFT; (l.words || []).forEach((w) => { w.time += SHIFT; if (w.end != null) w.end += SHIFT; }); });
  lines.forEach((l, i) => {
    const next = (lines[i + 1] || {}).time ?? l.time + 4;
    if (!l.words || !l.words.length) { // pas de mots horodatés : on répartit la ligne selon la longueur des mots (comme l'app)
      const toks = l.text.split(/\s+/).filter(Boolean), dur = Math.max(.6, Math.min(toks.join("").length * .085 + .4, next - l.time - .15)), wt = toks.map((t) => t.length + 2), tot = wt.reduce((a, b) => a + b, 0); let c = l.time;
      l.words = toks.map((t, k) => { const d = dur * wt[k] / tot, w = { time: c, end: c + d, text: t + (k < toks.length - 1 ? " " : "") }; c += d; return w; });
    }
  });
  LY = lines; const tr = $("#ly .track");
  tr.innerHTML = lines.map((l) => "<p>" + l.words.map((w) => `<span class="w">${w.text.replace(/</g, "&lt;")}</span>`).join("") + "</p>").join("");
  LINES = [...tr.children].map((p, i) => ({ p, ws: [...p.children].map((el, k) => ({ el, s: lines[i].words[k].time, e: Math.max(lines[i].words[k].time + .05, lines[i].words[k].end) })), start: lines[i].time }));
  CY = LINES.map((L) => L.p.offsetTop + L.p.offsetHeight / 2);
  $("#ly-art").src = COVER; $("#ly-title").textContent = TITLE; $("#ly-artist").textContent = ARTIST;
}
let CURW = null;
function paintLyrics(st) {
  if (!LINES.length) return;
  const H = BARE ? 932 : 690, t0 = LINES[0].start; let fa = -.7 * (1 - ease(seg(st, t0 - .35, t0 + .05)));
  for (let i = 1; i < LINES.length; i++) fa += ease(seg(st, LINES[i].start - .3, LINES[i].start + .22));
  const fc = Math.max(0, Math.min(LINES.length - 1, fa)), i0 = Math.floor(fc), i1 = Math.min(LINES.length - 1, i0 + 1);
  $("#ly .track").style.transform = `translateY(${(H * .34 - lerp(CY[i0], CY[i1], fc - i0)).toFixed(2)}px)`;
  const pw = (d, a) => { const i = Math.min(a.length - 1, Math.floor(d)), j = Math.min(a.length - 1, i + 1); return lerp(a[i], a[j], d - Math.floor(d)); };
  CURW = null;
  LINES.forEach((L, k) => {
    const d = Math.abs(k - fa), on = cl(1 - d);
    L.p.style.opacity = pw(d, [1, .72, .5, .38, .3]).toFixed(3); L.p.style.filter = `blur(${pw(d, [0, 1.4, 2.6, 3.6, 4.2]).toFixed(2)}px)`; L.p.style.transform = `scale(${(.94 + .06 * on).toFixed(4)})`;
    L.ws.forEach((w) => {
      const p = on > 0 ? cl((st - w.s) / (w.e - w.s)) : 0;
      w.el.style.setProperty("--p", p.toFixed(3)); w.el.style.setProperty("--a1", (.35 + .65 * on).toFixed(3)); w.el.style.setProperty("--a2", (.35 + .0 * on).toFixed(3));
      const held = (w.e - w.s) >= .9 ? Math.sin(Math.PI * p) ** .6 * on : 0; w.el.style.transform = held ? `scale(${(1 + .08 * held).toFixed(4)})` : "none";
      if (on > .5 && p > 0 && p < 1) CURW = w.el;
    });
    if (on > .5 && !CURW) { const done = L.ws.filter((w) => st >= w.e).pop() || L.ws[0]; CURW = done.el; }
  });
}
/** Rectangle (px CSS) du mot en cours de chant : sert à guider la caméra. */
window.wordRect = () => { if (!CURW) return null; const r = CURW.getBoundingClientRect(); return [r.x, r.y, r.width, r.height].map((v) => Math.round(v * 10) / 10); };

/* ───── image à l'instant `st` (secondes du MORCEAU) ───── */
window.setT = (st) => {
  // « respiration » sur le temps (PulseFollower sans mesure du son : 0,22 × (0,5 + 0,5 cos)) — ici calée sur les vrais temps du morceau
  const beat = (((st - BEAT0) * BPM / 60) % 1 + 1) % 1, energy = .22 * (.5 + .5 * Math.cos(2 * Math.PI * beat));
  paintMesh(st, energy);
  bg.style.transform = `scale(${1 + .03 * energy})`;
  $("#veil").style.opacity = String(.3 - .1 * energy);
  // image « vivante » : zoom et dérive lents (jamais sous 1,05), gonflement sur les temps forts
  const sc = 1.07 + .02 * Math.sin(st * .35) + .035 * energy;
  $("#cover").style.transform = `translate(${(6 * Math.sin(st * .23)).toFixed(2)}px, ${(5 * Math.cos(st * .19)).toFixed(2)}px) scale(${sc.toFixed(4)})`;
  paintLyrics(st);
  const f = Math.min(1, st / DUR);
  $("#fill").style.width = (f * 100).toFixed(3) + "%"; $("#t-cur").textContent = fmt(st); $("#t-rem").textContent = "-" + fmt(DUR - st);
};
window.ready = new Promise((res) => {
  const im = $("#cover"); im.crossOrigin = "anonymous";
  im.onload = async () => { await im.decode().catch(() => {}); PAL = palette(im); await document.fonts.ready; await loadLyrics(); window.setT(+q.get("t0") || 0); res(); };
  im.src = COVER;
});
</script>
</body>
</html>
