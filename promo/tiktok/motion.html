<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v) => Math.max(0, Math.min(1, v)), seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = (t) => 1 - Math.pow(1 - t, 3), eio = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), lerp = (a, b, t) => a + (b - a) * t;
const easeBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // dépasse un peu puis se pose
const q = new URLSearchParams(location.search), LYRC = q.get("lyricsclip") || window.TIMELINE.lyrics_clip, capture = q.has("capture"), CLIPS = q.get("clips") || "_clips", FPS = 60;

/* ───────── Le tempo ───────── */
const TL = window.TIMELINE, BEAT = 60 / TL.bpm, BAR = BEAT * 4;
const AU = window.AUDIO || null, KS = AU ? AU.kicks : null;
/** Coups de grosse caisse / 808 RÉELS du morceau (analyze-song.py : attaque exacte, force 0–1) ; sans analyse : la grille de tempo. */
function kick(t, d = .12, minS = 0) {
  if (!KS) return Math.exp(-(((t % BEAT) + BEAT) % BEAT) / (d + .01));
  let lo = 0, hi = KS.length; while (lo < hi) { const m = (lo + hi) >> 1; if (KS[m][0] <= t) lo = m + 1; else hi = m; }
  let v = 0;
  for (let j = lo - 1; j >= Math.max(0, lo - 4); j--) { const dt = t - KS[j][0]; if (dt > .6) break; if (KS[j][1] < minS) continue; v = Math.max(v, Math.pow(KS[j][1], .7) * Math.exp(-dt / d)); }
  return v;
}
const down = (t, d = .2) => (KS ? kick(t, d, .75) : Math.exp(-(((t % BAR) + BAR) % BAR) / d));   // accent : seulement les coups les plus forts
/** Énergie des basses (0–1) à l'instant t, mesurée dans l'audio. */
const bassAt = (t) => { if (!AU) return .5 * kick(t); const x = Math.max(0, t) * AU.fps, i = Math.floor(x), n = AU.bass.length; return lerp(AU.bass[Math.min(i, n - 1)], AU.bass[Math.min(i + 1, n - 1)], x - i); };
/** Instant du kick (assez fort) le plus proche de t, à ±0,11 s : les mouvements de caméra et les mots partent sur un vrai coup. */
function snapAbs(t) { if (!KS) return t; let best = t, bd = .11; for (const [kt, ks] of KS) { if (ks < .35) continue; const d = Math.abs(kt - t); if (d < bd) { bd = d; best = kt; } } return best; }
let CURA = 0, CAMD = { x: 0, y: 0, z: 0 };
const snapRel = (rel) => snapAbs(CURA + rel) - CURA, bk = (n) => snapRel(n * BEAT);
let NOW = 0, CAMZ = 1;
const reveal = (el, p, dy = 34, blur = 12) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; el.style.filter = p >= 1 ? "none" : `blur(${(1 - p) * blur}px)`; };

/* ───────── Couleurs ───────── */
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, "0")).join(""); };
const TINT = { grey: "#c9c8d2", ly: "#ff8a5c", arc: "#b9a4ff", home: "#7ee0b0", dev: "#8cc8ff", rc: "#ff8fb0", out: "#c9c8d2" };
const TINT2 = { grey: "#6e6d7a", ly: "#8a2a6e", arc: "#3b2aa8", home: "#0e6a68", dev: "#2a4fc8", rc: "#a02a4a", out: "#4b4a8a" };

/* ───────── Intro : mêmes fonctions que le site ───────── */
const intro = $("#intro"), word = $(".logo-word", intro), letters = $$("i", intro);
let restW = 0;
function paintIntro(p) {
  if (!restW) { restW = $(".rest > span", word).getBoundingClientRect().width; word.style.setProperty("--w", restW + "px"); }
  const draw = ease(seg(p, 0, .42)), fill = seg(p, .4, .5), pulse = seg(p, .42, .5) * (1 - seg(p, .5, .66));
  const glow = Math.min(1, pulse * 1.6 + .25 * fill * (1 - seg(p, .66, 1)));
  word.style.setProperty("--dash", 1 - draw); word.style.setProperty("--fill", fill); word.style.setProperty("--glow", glow); intro.style.setProperty("--glow", glow);
  $(".rest", word).style.setProperty("--o", ease(seg(p, .52, .85)));
  letters.forEach((l, k) => { const t = ease(seg(p, .56 + k * .07, .78 + k * .07)); l.style.opacity = t; l.style.transform = `translateY(${(1 - t) * 40}%)`; l.style.filter = `blur(${(1 - t) * 14}px)`; });
}
const heroWords = $$("#hero .lw");
function paintHero(lt) {
  $("#hero h1").style.opacity = ease(seg(lt, 0, .25));
  heroWords.forEach((w, k) => { // un mot par temps, avec un petit coup de poing
    const at = snapRel(k * BEAT), l = ease(seg(lt, at - .02, at + .16)), punch = lt >= at ? Math.exp(-(lt - at) / .14) : 0;
    w.style.color = `rgba(236,235,240,${(.3 + .7 * l).toFixed(3)})`; w.style.transform = `scale(${(1 + punch * .09).toFixed(4)})`;
  });
}

/* ───────── Légendes : « Paroles |mot à mot.| » (entre barres : mot coloré) ───────── */
const buildCap = (c) => { c.innerHTML = c.dataset.t.split("|").map((part, i) => part.split(/(\s+)/).filter(Boolean).map((w) => /^\s+$/.test(w) ? " " : `<span class="w${i % 2 ? " ac" : ""}">${w}</span>`).join("")).join(""); };
$$(".cap").forEach(buildCap);
function paintCap(sc, lt, delay = .12, vis = 1) {
  $$(".cap .w", sc).forEach((w, k) => { // les mots tombent sur les demi-temps
    const t0 = snapRel(delay + k * BEAT / 2), p = seg(lt, t0, t0 + .34), e = easeBack(p);
    w.style.opacity = clamp(p * 2.2) * vis; w.style.transform = `translateY(${((1 - e) * 60).toFixed(1)}px) scale(${(1 + (1 - e) * .3).toFixed(3)})`; w.style.filter = p >= 1 ? "none" : `blur(${((1 - p) * 16).toFixed(1)}px)`;
  });
  const sub = $("[data-sub]", sc); if (sub) { reveal(sub, ease(seg(lt, delay + BEAT * 1.5, delay + BEAT * 1.5 + .4)), 20, 6); sub.style.opacity = parseFloat(sub.style.opacity) * vis; }
}

/* ───────── Images des écrans réels (séquences filmées) ───────── */
const pending = [];
const CL = { iosplayer: 360, ioslyrics: 384, lyrics: 360, player: 360, home: 216, devices: 216, recap: 252 };
function setFrame(img, clip, time) {
  const i = Math.max(0, Math.min(CL[clip] - 1, Math.floor(time * FPS)));
  const url = `${CLIPS}/${clip}/f${String(i).padStart(4, "0")}.jpg`;
  if (img._u === url) return; img._u = url; img.src = url; pending.push(img.decode().catch(() => {}));
}
const P = (x, y, z, rx, ry, rz, s) => ({ x, y, z, rx, ry, rz, s });
/** Appareil en 3D : entrée avec rebond, dérive lente, coup de grosse caisse à chaque temps, et TRAVELLING AVANT :
 *  la caméra s'approche (translation en profondeur sous la perspective) et amène le point visé (c.cx, c.cy) au centre du cadre,
 *  cadre du téléphone compris, comme un vrai plan de pub. g = géométrie de l'appareil (boîtier + écran, en px). */
const PERSP = 2200, PO = { x: 540, y: 1920 * .46 }, TARGET = { x: 540, y: 900 };
const GEO_PHONE = { W: 508, H: 1068, pad: 14, sw: 480, sh: 1040 }, GEO_WIN = { W: 1160, H: 725, pad: 0, sw: 1160, sh: 725 };
function panel(el, lt, dur, from, mid, to, c, g) {
  const inK = easeBack(seg(lt, .06, .62)), drift = eio(seg(lt, .4, dur)), cur = {};
  for (const key in from) cur[key] = lerp(lerp(from[key], mid[key], inK), to[key], drift);
  const kk = kick(NOW), dd = down(NOW), bs = bassAt(NOW), flip = Math.floor(NOW / BAR) % 2 ? -1 : 1, zkk = clamp((c.z - 1) / 1.1), calm = 1 - .65 * zkk;
  const flat = 1 - .8 * zkk; cur.rx *= flat; cur.ry *= flat; cur.rz *= flat;                        // face à la caméra quand elle plonge
  cur.ry += 5.5 * Math.sin(NOW * .55) * (1 - zkk); cur.rx += 1.6 * Math.sin(NOW * .43 + 1) * (1 - zkk);   // l'appareil orbite doucement
  cur.s *= 1 + (kk * .014 + dd * .022 + bs * .01) * calm; cur.rz += flip * (kk * .4 + dd * .6) * flat; cur.y -= (kk * 7 + dd * 12) * calm;   // coups de basse
  cur.x += Math.sin(NOW * .9) * 6; cur.y += Math.sin(NOW * 1.1 + 1) * 8;
  const dz = PERSP * (1 - 1 / c.z); cur.z += dz;                                                    // la caméra avance : grossissement c.z
  const mat = (x, y) => new DOMMatrix().translateSelf(x, y, cur.z).rotateAxisAngleSelf(1, 0, 0, cur.rx).rotateAxisAngleSelf(0, 1, 0, cur.ry).rotateAxisAngleSelf(0, 0, 1, cur.rz).scaleSelf(cur.s);
  // où tombe le point visé à l'écran ? on décale le monde pour l'amener au centre (progressivement avec le zoom)
  const top = parseFloat(el.style.top) || 0, C0 = { x: 540, y: top + g.H / 2 };
  const q = new DOMPoint(g.pad + c.cx * g.sw - g.W / 2, g.pad + c.cy * g.sh - g.H / 2, 0);

  el.style.setProperty("--gx", (30 + cur.ry * 2.6 + 12 * Math.sin(NOW * .5)).toFixed(1) + "%"); el.style.setProperty("--gy", (16 - cur.rx * 1.6).toFixed(1) + "%");
  el.style.setProperty("--ga", (115 + cur.ry * 2.2).toFixed(1) + "deg"); el.style.setProperty("--bs", (bs * .6 + kk * .5).toFixed(3));   // reflet qui suit l'orientation, lueur qui bat

/** Plans en profondeur autour de l'appareil : pochettes et bokehs à différentes distances, flou de profondeur de champ,
 *  orbite lente, gonflement sur les basses, et parallaxe quand la caméra avance (ils reçoivent le même mouvement de monde). */
const FLS = {};
function buildFloaters(id, seed, cy, cov, wide = false) {
  const host = $(".p3d", $("#" + id)); let r = seed; const R = () => ((r = (r * 16807) % 2147483647) / 2147483647), items = [];
  for (let i = 0; i < 11; i++) {
    const isCov = i < 6, size = isCov ? lerp(150, 250, R()) : lerp(90, 220, R()), side = i % 2 ? 1 : -1;
    const z = isCov ? lerp(-480, 380, R()) : lerp(-700, 160, R());
    // fenêtres larges : plans au-dessus et au-dessous (jamais devant l'écran) ; téléphones : de chaque côté
    const x = wide ? lerp(-520, 520, R()) : side * lerp(330, 640, R()), y = wide ? cy + (i % 2 ? 1 : -1) * lerp(470, 760, R()) : cy + lerp(-640, 700, R());
    const el = document.createElement("div"); el.className = "fl " + (isCov ? "cv" : "bk"); el.style.width = el.style.height = size + "px"; el.style.marginLeft = -size / 2 + "px"; el.style.top = y - size / 2 + "px";
    if (isCov) el.innerHTML = `<img src="_covers/${(cov + i) % 9}.jpg" alt="">`;
    host.append(el); items.push({ el, z, x, y, size, ph: R() * 6.28, w: lerp(.25, .6, R()), amp: lerp(18, 54, R()), t0: .12 + i * .07, isCov });

function floaters(id, lt, c) {
  const zkk = clamp((c.z - 1) / 1.1);
  for (const f of FLS[id]) {
    const p = easeBack(seg(lt, f.t0, f.t0 + .55)), zt = f.z + CAMD.z, bs = bassAt(NOW), kk = kick(NOW);
    const near = zt > PERSP * .74;                                                  // passé derrière la caméra : on le retire
    const o = near ? 0 : clamp(p * 2) * clamp(1 - zkk * 2.1) * (f.isCov ? 1 : .8);   // disparaissent quand la caméra plonge : ils ne masquent jamais l'interface
    const ox = f.amp * Math.sin(NOW * f.w + f.ph), oy = f.amp * .8 * Math.cos(NOW * f.w * .8 + f.ph);
    f.el.style.opacity = o.toFixed(3); if (!o) continue;
    f.el.style.transform = `translate3d(${(f.x + ox + CAMD.x).toFixed(1)}px, ${(oy + CAMD.y).toFixed(1)}px, ${zt.toFixed(1)}px) rotateY(${(Math.sin(NOW * f.w + f.ph) * 22).toFixed(1)}deg) rotateZ(${(Math.sin(NOW * .4 + f.ph) * 9).toFixed(1)}deg) scale(${(p * (1 + bs * .08 + kk * .05)).toFixed(3)})`;
    const dof = Math.min(11, Math.abs(f.z) / 70 + (f.isCov ? 0 : 3)); f.el.style.filter = `blur(${dof.toFixed(1)}px)`;   // profondeur de champ : net au plan de l'appareil
  }
}

/* ───────── Caméra : zoom net dans l'écran filmé, qui claque sur les temps (courbe douce façon pub Apple) ─────────

const bt = (n) => n * BEAT;
const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
/** État brut de la caméra à lt : chaque ligne [temps, zoom, cx, cy, durée] est une cible, atteinte par une courbe très douce. */
function cam0(kf, lt) {

}

}
const camera = (kf, lt) => camFrom((l) => cam0(kf, l), lt);
const camVis = (c) => 1 - eio(seg(c.z, 1.25, 1.9));   // les légendes s'effacent quand la caméra plonge
/** Paroles : la caméra suit le mot chanté (positions relevées pendant le tournage : _clips/<clip>/track.js), glissement très doux. */
function followRaw(lt, clipT) {
  const T = window.TRACKS && window.TRACKS[LYRC]; if (!T) return { z: 1, cx: .5, cy: .5 };
  const i0 = Math.floor(clipT * FPS) + 3; let sx = 0, sy = 0, sw = 0;
  for (let k = -18; k <= 18; k++) { const r = T.rects[Math.max(0, Math.min(T.rects.length - 1, i0 + k))]; if (!r) continue; const w = Math.exp(-(k * k) / (2 * 8 * 8)); sx += (r[0] + r[2] / 2) * w; sy += (r[1] + r[3] / 2) * w; sw += w; }

  return { z: lerp(1, 2.3, zoom), cx: lerp(.5, cx, zoom), cy: lerp(.5, cy, zoom) };
}

/* ───────── Scènes ───────── */
const topEl = $("#top");
function sceneLyrics(lt, dur) {
  if (!sceneLyrics.done) { sceneLyrics.done = 1; $("#s_ly .cap").dataset.t = (LYRC === "lyrics" || LYRC === "ioslyrics") ? "Paroles |mot à mot.|" : "Ton |son|, en |grand.|"; buildCap($("#s_ly .cap")); }
  const el = $("#ph_ly"); el.style.top = "500px";
  const c = (LYRC === "lyrics" || LYRC === "ioslyrics") ? camFrom((l) => followRaw(l, l - .3), lt)
    : camera(LYRC === "iosplayer" ? [[bk(1.5), 1.5, .5, .30, .85], [bk(4), 2.3, .27, .68, .85], [bk(7), 1.9, .5, .80, .85], [bk(13), 1, .5, .5, .95]]
                                     : [[bk(1.5), 1.55, .5, .37, .85], [bk(4), 2.3, .23, .71, .85], [bk(7), 1.9, .5, .80, .85], [bk(13), 1, .5, .5, .95]], lt);
  paintCap($("#s_ly"), lt, .12, camVis(c));
  panel(el, lt, dur, P(90, 260, -260, 16, -38, -9, .84), P(10, 0, 0, 7, -17, -3, 1), P(-18, -22, 40, 4, -8, -1.5, 1.05), c, GEO_PHONE);
  floaters("s_ly", lt, c);
  setFrame($("img", el), LYRC, lt - .3);
}
function sceneHome(lt, dur) {
  const el = $("#wn_home"); el.style.top = "620px";
  const c = camera([[bk(.8), 2.0, .77, .31, .85], [bk(4), 1, .5, .5, .9]], lt);
  paintCap($("#s_home"), lt, .12, camVis(c));
  panel(el, lt, dur, P(180, 240, -320, 22, 22, 6, .78), P(40, 0, 0, 11, 10, 2, 1), P(-10, -30, 30, 6, 5, 0, 1.07), c, GEO_WIN);
  floaters("s_home", lt, c);
  setFrame($("img", el), "home", lt - .25);
}
function sceneDev(lt, dur) {
  const el = $("#wn_dev"); el.style.top = "790px";
  const c = camera([[bk(3), 2.0, .58, .52, .85], [bk(5.5), 2.4, .59, .93, .85], [bk(7.2), 1, .5, .5, .6]], lt);
  paintCap($("#s_dev"), lt, .12, camVis(c));
  panel(el, lt, dur, P(-180, 240, -320, 22, -22, -6, .78), P(-40, 0, 0, 11, -10, -2, 1), P(10, -30, 30, 6, -5, 0, 1.07), c, GEO_WIN);
  floaters("s_dev", lt, c);
  setFrame($("img", el), "devices", lt - .25);
}
function sceneRecap(lt, dur) {
  const el = $("#ph_rc"); el.style.top = "500px";
  const c = camera([[bk(.6), 1.5, .5, .5, .85], [bk(2.4), 2.3, .5, .5, .85], [bk(5), 1.9, .5, .47, .85], [bk(7), 1, .5, .5, .6]], lt);
  paintCap($("#s_rc"), lt, .12, camVis(c));
  panel(el, lt, dur, P(-90, 260, -260, 16, 38, 9, .84), P(-6, 0, 0, 7, 16, 3, 1), P(14, -22, 40, 4, 8, 1.5, 1.05), c, GEO_PHONE);

buildFloaters("s_ly", 11, 1034, 0); buildFloaters("s_home", 23, 982, 3, true); buildFloaters("s_dev", 37, 1152, 5, true); buildFloaters("s_rc", 53, 1034, 7);
// Arc de pochettes : elles claquent l'une après l'autre sur le rythme, puis l'arc tourne.
const arc = $("#arc"), N_COV = 9;
arc.innerHTML = Array.from({ length: N_COV }, (_, i) => `<div class="cov"><img src="_covers/${i}.jpg" alt=""></div>`).join("");
const covs = $$(".cov", arc);
function sceneArc(lt, dur) {
  paintCap($("#s_arc"), lt, .1);
  const spin = (lt / dur - .5) * 24 + (1 - ease(seg(lt, 0, .9))) * 14;
  covs.forEach((c, i) => {
    const f = i / (N_COV - 1) - .5, a = (f * 104 + spin) * Math.PI / 180, R = 560, cx = 540, cy = 1040;
    const p = seg(lt, i * BEAT / 3, i * BEAT / 3 + .38), k = easeBack(p);
    const x = cx + Math.sin(a) * R, y = cy - Math.cos(a) * R + (1 - k) * 520, hit = kick(NOW) * .06;
    c.style.opacity = clamp(p * 3); c.style.filter = p >= 1 ? "none" : `blur(${(1 - p) * 12}px)`;
    c.style.transform = `translate3d(${x - 540}px, ${y}px, ${-Math.abs(f) * 160}px) rotateZ(${a * 180 / Math.PI * .9}deg) rotateY(${-f * 26}deg) scale(${(.5 + .5 * k + hit).toFixed(3)})`;
  });
}
function paintOutro(lt) {
  const g = easeBack(seg(lt, 0, .5)), icon = $("#outro .icon"), pulse = kick(NOW, .2) * .5 + down(NOW) * .5;
  icon.style.opacity = clamp(seg(lt, 0, .15) * 3); icon.style.transform = `scale(${(.6 + .4 * g + pulse * .05).toFixed(4)})`;
  icon.style.filter = `drop-shadow(0 0 ${(pulse * 70).toFixed(1)}px rgba(236,236,244,${(pulse * .6).toFixed(3)}))`;
  const at = (n) => ease(seg(lt, n * BEAT, n * BEAT + .4));
  reveal($("#outro .name"), at(1), 50, 16); reveal($("#outro .tag"), at(2), 28, 8); reveal($("#outro .plats"), at(3), 18, 4); reveal($("#outro .pill"), at(4), 24, 4);
}

/* ───────── Montage (en temps) ───────── */
const IN_START = TL.intro_start, IN_DUR = TL.intro_dur; // l'animation du site, à son rythme d'origine
const PAINT = { intro: (lt) => paintIntro(clamp((lt - IN_START) / IN_DUR)), hero: paintHero, s_ly: sceneLyrics, s_arc: sceneArc, s_home: sceneHome, s_dev: sceneDev, s_rc: sceneRecap, outro: paintOutro };
const TINTS = { intro: "grey", hero: "grey", s_ly: "ly", s_arc: "arc", s_home: "home", s_dev: "dev", s_rc: "rc", outro: "out" };
const S = TL.scenes.map((s, i) => ({ ...s, i, a: s.b0 * BEAT, b: (s.b0 + s.beats) * BEAT, el: $("#" + s.id), tint: TINTS[s.id], paint: PAINT[s.id] }));
const DURATION = S[S.length - 1].b, WHIP = { a: .13, b: .24 }; // le cut se fait autour du temps : un coup de fouet de 0,37 s
window.TIMELINE_CUTS = S.map((s) => s.a);
async function seek(t) {

    s.el.style.transform = x || sc !== 1 ? `translate3d(${x.toFixed(1)}px,0,0) scale(${sc.toFixed(4)})` : "none";

  const prev = S[Math.max(0, cur.i - 1)], k = cur.i ? ease(seg(t, cur.a - WHIP.a, cur.a + .3)) : 1, st = $("#stage").style;
  st.setProperty("--tint", mixc(TINT[prev.tint], TINT[cur.tint], k)); st.setProperty("--tint2", mixc(TINT2[prev.tint], TINT2[cur.tint], k));
  const pulse = bassAt(t) * .34 + kick(t, .16) * .2 + down(t) * .28;   // les lueurs battent avec les basses réelles
  st.setProperty("--amb", String(ease(seg(t, 1.6, 4.6)) * (.78 + pulse)));  // les lueurs pulsent avec le kick
  $$("#amb i").forEach((el, i) => { el.style.transform = `translate(${Math.sin(t * .5 + i * 2) * 90}px, ${Math.cos(t * .4 + i) * 60}px) scale(${1 + Math.sin(t * .4 + i) * .06 + pulse * .12})`; });
  topEl.style.opacity = ease(seg(t, S[2].a - .2, S[2].a + .2)) * (1 - ease(seg(t, S[7].a - .2, S[7].a + .15))) * (1 - eio(seg(CAMZ, 1.2, 1.7)));
  topEl.style.transform = `scale(${(1 + kick(t) * .05).toFixed(3)})`;
  await Promise.all(pending);
}
window.seek = seek; window.DURATION = DURATION;

if (q.has("guides")) $("#guides").style.display = "block";
function fit() {
  const k = capture ? 1 : Math.min(innerWidth / 1080, innerHeight / 1920), st = $("#stage");
  st.style.transform = `scale(${k})`; st.style.left = (innerWidth - 1080 * k) / 2 + "px"; st.style.top = (innerHeight - 1920 * k) / 2 + "px";
}
fit(); addEventListener("resize", fit);
window.ready = Promise.all([new Promise((res) => { if (LYRC !== "lyrics" && LYRC !== "ioslyrics") return res(); const sc = document.createElement("script"); sc.src = CLIPS + "/" + LYRC + "/track.js"; sc.onload = sc.onerror = res; document.head.append(sc); }), document.fonts.load("700 100px 'Familjen Grotesk'"), document.fonts.load("500 40px 'Familjen Grotesk'"), document.fonts.load("500 26px 'IBM Plex Mono'")]).then(() => document.fonts.ready).then(async () => {
  await seek(IN_START + IN_DUR); restW = 0; await seek(0);
  if (capture) return;
  const t0 = performance.now(); let busy = false;
  const loop = async (now) => { if (!busy) { busy = true; await seek(Math.min(((now - t0) / 1000) % (DURATION + .8), DURATION - .001)); busy = false; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
