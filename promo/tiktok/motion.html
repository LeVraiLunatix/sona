<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sona, motion design TikTok (interfaces réelles)</title>
<style>
@font-face { font-family: "Familjen Grotesk"; font-weight: 500; src: url("../../web/fonts/FamiljenGrotesk-500.woff2") format("woff2"); }
@font-face { font-family: "Familjen Grotesk"; font-weight: 700; src: url("../../web/fonts/FamiljenGrotesk-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../web/fonts/IBMPlexMono-500-latin.woff2") format("woff2"); }
:root { --bg: #07070a; --fg: #f4f3f8; --mid: rgba(244, 243, 248, .66); --dim: rgba(244, 243, 248, .34); --tint: #ff9a6b;
  --font: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; background: var(--bg); overflow: hidden; color: var(--fg); font: 500 40px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
.sc { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }

/* Lueurs d'ambiance : ancrées en bas, comme dans les vidéos de référence */
#amb { position: absolute; inset: 0; opacity: var(--amb, 1); }
#amb i { position: absolute; border-radius: 50%; filter: blur(110px); background: var(--tint); will-change: transform; }
#amb .a { left: -160px; top: 1250px; width: 1100px; height: 900px; opacity: .55; }
#amb .b { left: 380px; top: 1500px; width: 1000px; height: 800px; opacity: .42; background: var(--tint2); }
#amb .c { left: 120px; top: -420px; width: 900px; height: 700px; opacity: .16; background: var(--tint2); }
#amb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(7, 7, 10, .5), rgba(7, 7, 10, 0) 38%, rgba(7, 7, 10, 0) 70%, rgba(7, 7, 10, .25)); }

/* Intro (identique au site) */
#intro .stage { position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 60px; }
#intro .stage::before { content: ""; position: absolute; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(210, 209, 216, .22), transparent); opacity: var(--glow, 0); transform: scale(calc(.8 + var(--glow, 0) * .4)); }
.logo-word { direction: ltr; position: relative; display: flex; align-items: baseline; font-size: 330px; font-weight: 700; letter-spacing: -.05em; line-height: 1; }
.logo-word svg { height: .72em; width: auto; overflow: visible; flex: none; }
.logo-word .glyph { fill: #d2d1d8; fill-opacity: var(--fill, 0); stroke: #d2d1d8; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: var(--dash, 1); filter: drop-shadow(0 0 calc(var(--glow, 0) * 26px) rgba(236, 236, 244, calc(var(--glow, 0) * .95))); }
.logo-word .rest { display: block; width: calc(var(--o, 0) * var(--w, 0px)); white-space: nowrap; }
.logo-word .rest > span { display: block; width: max-content; padding-right: .1em; margin-left: .04em; }
.logo-word .rest i { font-style: normal; display: inline-block; color: #d2d1d8; opacity: 0; }

/* Accroche */
#hero .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 120px; text-align: center; }
#hero h1 { margin: 0; font: 700 196px/.95 var(--font); letter-spacing: -.055em; }
#hero h1 .ln { display: block; }
#hero .lw { display: inline-block; color: rgba(236, 235, 240, .3); }

/* En-tête permanent */
#top { position: absolute; left: 0; right: 0; top: 168px; text-align: center; opacity: 0; }
#top .row { display: inline-flex; align-items: center; gap: 16px; }
#top svg { width: 52px; height: 52px; border-radius: 13px; }
#top b { font: 700 46px/1 var(--font); letter-spacing: -.04em; }
#top p { margin: 14px 0 0; font: 700 30px/1 var(--font); letter-spacing: -.01em; }
#top p em { font-style: normal; color: var(--tint); }

/* Légendes cinétiques */
.cap { position: absolute; left: 70px; right: 70px; text-align: center; font: 700 96px/1.04 var(--font); letter-spacing: -.045em; text-wrap: balance; }
.cap .w { display: inline-block; white-space: pre; }
.cap .w.ac { color: var(--tint); }
.sub { position: absolute; left: 130px; right: 130px; text-align: center; font: 500 40px/1.35 var(--font); color: var(--mid); letter-spacing: -.01em; text-wrap: balance; }

/* Panneaux en perspective */
.p3d { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 46%; }
.obj { position: absolute; left: 50%; top: 0; transform-style: preserve-3d; will-change: transform; }
.phone { width: 508px; height: 1068px; margin-left: -254px; border-radius: 76px; padding: 14px; background: #101013; box-shadow: 0 0 0 2px #2b2b31, 0 0 0 3px #08080a, 0 70px 140px rgba(0, 0, 0, .7), 0 0 170px color-mix(in srgb, var(--tint) 30%, transparent); }
.phone .scr { width: 480px; height: 1040px; border-radius: 62px; overflow: hidden; background: #000; position: relative; }
.phone .scr img, .win .scr img { display: block; width: 100%; height: 100%; object-fit: cover; }
.win { width: 1160px; height: 725px; margin-left: -580px; border-radius: 30px; padding: 0; background: #0d0d10; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .14), 0 70px 140px rgba(0, 0, 0, .7), 0 0 170px color-mix(in srgb, var(--tint) 26%, transparent); overflow: hidden; }
.win .scr { width: 100%; height: 100%; }
.gloss { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .06) 100%); mix-blend-mode: screen; }

/* Arc de pochettes */
.arc { position: absolute; inset: 0; perspective: 1800px; }
.cov { position: absolute; left: 50%; top: 0; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 34px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14); }
.cov img { width: 100%; height: 100%; display: block; }

/* Final */
#outro .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 150px; text-align: center; }
#outro .icon { width: 250px; height: 250px; border-radius: 58px; box-shadow: 0 0 0 2px rgba(236, 235, 240, .1); }
#outro .name { margin: 62px 0 0; font: 700 190px/1 var(--font); letter-spacing: -.055em; }
#outro .tag { margin: 22px 0 0; font: 500 52px/1.2 var(--font); color: var(--mid); letter-spacing: -.02em; }
#outro .plats { margin-top: 84px; font: 500 30px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
#outro .pill { margin-top: 48px; display: inline-flex; align-items: center; justify-content: center; height: 112px; padding: 0 64px; border-radius: 56px; font: 700 44px/1 var(--font); color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .08)); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28), 0 24px 60px rgba(0, 0, 0, .4); }
#guides { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 9; }
#guides b { position: absolute; background: rgba(255, 0, 80, .16); outline: 2px dashed rgba(255, 0, 80, .7); }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="s" viewBox="0 0 64 64"><rect width="64" height="64" rx="14.4" fill="#000"/><g transform="translate(32 32) scale(0.24145) translate(-200.169 -200)"><path d="M271.23,120.00 L133.00,120.00 A15.00,15.00 0 0 0 118.00,135.00 L118.00,146.83 A15.00,15.00 0 0 0 121.19,156.07 L173.56,222.99 A13.00,13.00 0 0 1 163.32,244.00 L133.00,244.00 A15.00,15.00 0 0 0 118.00,259.00 L118.00,265.00 A15.00,15.00 0 0 0 133.00,280.00 L260.23,280.00 A15.00,15.00 0 0 0 274.25,259.66 L269.52,247.24 A212.16,212.16 0 0 0 237.99,191.57 L226.56,177.04 A13.00,13.00 0 0 1 236.77,156.00 L259.97,156.00 A15.00,15.00 0 0 0 272.45,149.32 L280.48,137.28 A11.11,11.11 0 0 0 271.23,120.00 Z" fill="#d2d1d8"/></g></symbol></svg>

<div id="amb"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<section class="sc" id="intro"><div class="stage"><div class="logo-word">
  <svg viewBox="118 120 163 160" aria-hidden="true"><path class="glyph" pathLength="1" d="M271.23,120.00 L133.00,120.00 A15.00,15.00 0 0 0 118.00,135.00 L118.00,146.83 A15.00,15.00 0 0 0 121.19,156.07 L173.56,222.99 A13.00,13.00 0 0 1 163.32,244.00 L133.00,244.00 A15.00,15.00 0 0 0 118.00,259.00 L118.00,265.00 A15.00,15.00 0 0 0 133.00,280.00 L260.23,280.00 A15.00,15.00 0 0 0 274.25,259.66 L269.52,247.24 A212.16,212.16 0 0 0 237.99,191.57 L226.56,177.04 A13.00,13.00 0 0 1 236.77,156.00 L259.97,156.00 A15.00,15.00 0 0 0 272.45,149.32 L280.48,137.28 A11.11,11.11 0 0 0 271.23,120.00 Z"/></svg>
  <span class="rest"><span><i>o</i><i>n</i><i>a</i></span></span></div></div></section>

<!-- 01 Paroles (téléphone) -->

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v) => Math.max(0, Math.min(1, v)), seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = (t) => 1 - Math.pow(1 - t, 3), eio = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), lerp = (a, b, t) => a + (b - a) * t;
const easeBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // dépasse un peu puis se pose
const q = new URLSearchParams(location.search), capture = q.has("capture"), CLIPS = q.get("clips") || "_clips", FPS = 60;

/* ───────── Le tempo ───────── */
const TL = window.TIMELINE, BEAT = 60 / TL.bpm, BAR = BEAT * 4;
const kick = (t, d = .13) => Math.exp(-(((t % BEAT) + BEAT) % BEAT) / d);        // 1 sur chaque temps, retombe vite
const down = (t, d = .22) => Math.exp(-(((t % BAR) + BAR) % BAR) / d);           // accent sur le premier temps de chaque mesure
let NOW = 0;
const reveal = (el, p, dy = 34, blur = 12) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; el.style.filter = p >= 1 ? "none" : `blur(${(1 - p) * blur}px)`; };

/* ───────── Couleurs ───────── */
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, "0")).join(""); };
const TINT = { grey: "#c9c8d2", ly: "#ff8a5c", arc: "#b9a4ff", home: "#7ee0b0", dev: "#8cc8ff", rc: "#ff8fb0", out: "#c9c8d2" };
const TINT2 = { grey: "#6e6d7a", ly: "#8a2a6e", arc: "#3b2aa8", home: "#0e6a68", dev: "#2a4fc8", rc: "#a02a4a", out: "#4b4a8a" };

/* ───────── Intro : mêmes fonctions que le site ───────── */
const intro = $("#intro"), word = $(".logo-word", intro), letters = $$("i", intro);
let restW = 0;
function paintIntro(p) {
  if (!restW) { restW = $(".rest > span", word).getBoundingClientRect().width; word.style.setProperty("--w", restW + "px"); }
  const draw = ease(seg(p, 0, .42)), fill = seg(p, .4, .5), pulse = seg(p, .42, .5) * (1 - seg(p, .5, .66));
  const glow = Math.min(1, pulse * 1.6 + .25 * fill * (1 - seg(p, .66, 1)));
  word.style.setProperty("--dash", 1 - draw); word.style.setProperty("--fill", fill); word.style.setProperty("--glow", glow); intro.style.setProperty("--glow", glow);
  $(".rest", word).style.setProperty("--o", ease(seg(p, .52, .85)));
  letters.forEach((l, k) => { const t = ease(seg(p, .56 + k * .07, .78 + k * .07)); l.style.opacity = t; l.style.transform = `translateY(${(1 - t) * 40}%)`; l.style.filter = `blur(${(1 - t) * 14}px)`; });
}
const heroWords = $$("#hero .lw");
function paintHero(lt) {
  $("#hero h1").style.opacity = ease(seg(lt, 0, .25));
  heroWords.forEach((w, k) => { // un mot par temps, avec un petit coup de poing
    const at = k * BEAT, l = ease(seg(lt, at - .02, at + .16)), punch = lt >= at ? Math.exp(-(lt - at) / .14) : 0;
    w.style.color = `rgba(236,235,240,${(.3 + .7 * l).toFixed(3)})`; w.style.transform = `scale(${(1 + punch * .09).toFixed(4)})`;
  });
}

/* ───────── Légendes : « Paroles |mot à mot.| » (entre barres : mot coloré) ───────── */
$$(".cap").forEach((c) => {
  c.innerHTML = c.dataset.t.split("|").map((part, i) => part.split(/(\s+)/).filter(Boolean).map((w) => /^\s+$/.test(w) ? " " : `<span class="w${i % 2 ? " ac" : ""}">${w}</span>`).join("")).join("");
});
function paintCap(sc, lt, delay = .12) {
  $$(".cap .w", sc).forEach((w, k) => { // les mots tombent sur les demi-temps
    const p = seg(lt, delay + k * BEAT / 2, delay + k * BEAT / 2 + .34), e = easeBack(p);
    w.style.opacity = clamp(p * 2.2); w.style.transform = `translateY(${((1 - e) * 60).toFixed(1)}px) scale(${(1 + (1 - e) * .3).toFixed(3)})`; w.style.filter = p >= 1 ? "none" : `blur(${((1 - p) * 16).toFixed(1)}px)`;
  });
  const sub = $("[data-sub]", sc); if (sub) reveal(sub, ease(seg(lt, delay + BEAT * 1.5, delay + BEAT * 1.5 + .4)), 20, 6);
}

/* ───────── Images des écrans réels (séquences filmées) ───────── */
const pending = [];
const CL = { lyrics: 360, home: 216, devices: 216, recap: 252 };
function setFrame(img, clip, time) {
  const i = Math.max(0, Math.min(CL[clip] - 1, Math.floor(time * FPS)));
  const url = `${CLIPS}/${clip}/f${String(i).padStart(4, "0")}.jpg`;
  if (img._u === url) return; img._u = url; img.src = url; pending.push(img.decode().catch(() => {}));
}
const P = (x, y, z, rx, ry, rz, s) => ({ x, y, z, rx, ry, rz, s });
/** Panneau 3D : entrée avec rebond, dérive lente, et un coup de grosse caisse à chaque temps. */
function panel(el, lt, dur, from, mid, to) {
  const inK = easeBack(seg(lt, .06, .62)), drift = eio(seg(lt, .4, dur)), cur = {};
  for (const key in from) cur[key] = lerp(lerp(from[key], mid[key], inK), to[key], drift);
  const k = kick(NOW), d = down(NOW), flip = Math.floor(NOW / BAR) % 2 ? -1 : 1;
  cur.s *= 1 + k * .012 + d * .02; cur.rz += flip * (k * .35 + d * .5); cur.y -= k * 6 + d * 10;
  el.style.transform = `translate3d(${cur.x + Math.sin(NOW * .9) * 6}px, ${cur.y + Math.sin(NOW * 1.1 + 1) * 8}px, ${cur.z}px) rotateX(${cur.rx}deg) rotateY(${cur.ry}deg) rotateZ(${cur.rz}deg) scale(${cur.s})`;
  el.style.opacity = ease(seg(lt, .04, .3));
}

/* ───────── Scènes ───────── */
const topEl = $("#top");
function sceneLyrics(lt, dur) {
  paintCap($("#s_ly"), lt);
  const el = $("#ph_ly"); el.style.top = "500px";
  panel(el, lt, dur, P(90, 260, -260, 16, -38, -9, .84), P(10, 0, 0, 7, -17, -3, 1), P(-18, -22, 40, 4, -8, -1.5, 1.05));
  setFrame($("img", el), "lyrics", lt - .3);
}
function sceneHome(lt, dur) {
  paintCap($("#s_home"), lt);
  const el = $("#wn_home"); el.style.top = "620px";
  panel(el, lt, dur, P(180, 240, -320, 22, 22, 6, .78), P(40, 0, 0, 11, 10, 2, 1), P(-10, -30, 30, 6, 5, 0, 1.07));
  setFrame($("img", el), "home", lt - .25);
}
function sceneDev(lt, dur) {
  paintCap($("#s_dev"), lt);
  const el = $("#wn_dev"); el.style.top = "790px";
  panel(el, lt, dur, P(-180, 240, -320, 22, -22, -6, .78), P(-40, 0, 0, 11, -10, -2, 1), P(10, -30, 30, 6, -5, 0, 1.07));
  setFrame($("img", el), "devices", lt - .25);
}
function sceneRecap(lt, dur) {
  paintCap($("#s_rc"), lt);
  const el = $("#ph_rc"); el.style.top = "500px";
  panel(el, lt, dur, P(-90, 260, -260, 16, 38, 9, .84), P(-6, 0, 0, 7, 16, 3, 1), P(14, -22, 40, 4, 8, 1.5, 1.05));
  setFrame($("img", el), "recap", lt - .25);
}
// Arc de pochettes : elles claquent l'une après l'autre sur le rythme, puis l'arc tourne.
const arc = $("#arc"), N_COV = 9;
arc.innerHTML = Array.from({ length: N_COV }, (_, i) => `<div class="cov"><img src="_covers/${i}.jpg" alt=""></div>`).join("");
const covs = $$(".cov", arc);
function sceneArc(lt, dur) {
  paintCap($("#s_arc"), lt, .1);
  const spin = (lt / dur - .5) * 24 + (1 - ease(seg(lt, 0, .9))) * 14;
  covs.forEach((c, i) => {
    const f = i / (N_COV - 1) - .5, a = (f * 104 + spin) * Math.PI / 180, R = 560, cx = 540, cy = 1040;
    const p = seg(lt, i * BEAT / 3, i * BEAT / 3 + .38), k = easeBack(p);
    const x = cx + Math.sin(a) * R, y = cy - Math.cos(a) * R + (1 - k) * 520, hit = kick(NOW) * .06;
    c.style.opacity = clamp(p * 3); c.style.filter = p >= 1 ? "none" : `blur(${(1 - p) * 12}px)`;
    c.style.transform = `translate3d(${x - 540}px, ${y}px, ${-Math.abs(f) * 160}px) rotateZ(${a * 180 / Math.PI * .9}deg) rotateY(${-f * 26}deg) scale(${(.5 + .5 * k + hit).toFixed(3)})`;
  });
}
function paintOutro(lt) {
  const g = easeBack(seg(lt, 0, .5)), icon = $("#outro .icon"), pulse = kick(NOW, .2) * .5 + down(NOW) * .5;
  icon.style.opacity = clamp(seg(lt, 0, .15) * 3); icon.style.transform = `scale(${(.6 + .4 * g + pulse * .05).toFixed(4)})`;
  icon.style.filter = `drop-shadow(0 0 ${(pulse * 70).toFixed(1)}px rgba(236,236,244,${(pulse * .6).toFixed(3)}))`;
  const at = (n) => ease(seg(lt, n * BEAT, n * BEAT + .4));
  reveal($("#outro .name"), at(1), 50, 16); reveal($("#outro .tag"), at(2), 28, 8); reveal($("#outro .plats"), at(3), 18, 4); reveal($("#outro .pill"), at(4), 24, 4);
}

/* ───────── Montage (en temps) ───────── */
const IN_START = .1, IN_DUR = 3.9;
const PAINT = { intro: (lt) => paintIntro(clamp((lt - IN_START) / IN_DUR)), hero: paintHero, s_ly: sceneLyrics, s_arc: sceneArc, s_home: sceneHome, s_dev: sceneDev, s_rc: sceneRecap, outro: paintOutro };
const TINTS = { intro: "grey", hero: "grey", s_ly: "ly", s_arc: "arc", s_home: "home", s_dev: "dev", s_rc: "rc", outro: "out" };
const S = TL.scenes.map((s, i) => ({ ...s, i, a: s.b0 * BEAT, b: (s.b0 + s.beats) * BEAT, el: $("#" + s.id), tint: TINTS[s.id], paint: PAINT[s.id] }));
const DURATION = S[S.length - 1].b, WHIP = { a: .13, b: .24 }; // le cut se fait autour du temps : un coup de fouet de 0,37 s
window.TIMELINE_CUTS = S.map((s) => s.a);
async function seek(t) {
  NOW = t; pending.length = 0;
  let cur = S[0];
  for (const s of S) {
    const inP = s.i ? ease(seg(t, s.a - WHIP.a, s.a + WHIP.b)) : 1, outP = s.i < S.length - 1 ? ease(seg(t, s.b - WHIP.a, s.b + WHIP.b)) : 0;
    const on = t >= s.a - WHIP.a && t < s.b + WHIP.b;
    s.el.style.display = on ? "block" : "none";
    if (t >= s.a - WHIP.a) cur = s;
    if (!on) continue;
    // coup de fouet : la scène qui sort file à gauche en se floutant, celle qui entre arrive de la droite
    const x = (1 - inP) * 1150 - outP * 1150, bl = (1 - inP) * 26 + outP * 26;
    s.el.style.transform = x ? `translate3d(${x.toFixed(1)}px,0,0)` : "none";
    s.el.style.filter = bl > .3 ? `blur(${bl.toFixed(1)}px)` : "none";
    s.paint(Math.max(0, t - s.a), s.b - s.a);
  }
  const prev = S[Math.max(0, cur.i - 1)], k = cur.i ? ease(seg(t, cur.a - WHIP.a, cur.a + .3)) : 1, st = $("#stage").style;
  st.setProperty("--tint", mixc(TINT[prev.tint], TINT[cur.tint], k)); st.setProperty("--tint2", mixc(TINT2[prev.tint], TINT2[cur.tint], k));
  const pulse = kick(t, .16) * .22 + down(t) * .3;
  st.setProperty("--amb", String(ease(seg(t, 1.6, 4.6)) * (.78 + pulse)));  // les lueurs pulsent avec le kick
  $$("#amb i").forEach((el, i) => { el.style.transform = `translate(${Math.sin(t * .5 + i * 2) * 90}px, ${Math.cos(t * .4 + i) * 60}px) scale(${1 + Math.sin(t * .4 + i) * .06 + pulse * .12})`; });
  topEl.style.opacity = ease(seg(t, S[2].a - .2, S[2].a + .2)) * (1 - ease(seg(t, S[7].a - .2, S[7].a + .15)));
  topEl.style.transform = `scale(${(1 + kick(t) * .05).toFixed(3)})`;
  await Promise.all(pending);
}
window.seek = seek; window.DURATION = DURATION;

if (q.has("guides")) $("#guides").style.display = "block";
function fit() {
  const k = capture ? 1 : Math.min(innerWidth / 1080, innerHeight / 1920), st = $("#stage");
  st.style.transform = `scale(${k})`; st.style.left = (innerWidth - 1080 * k) / 2 + "px"; st.style.top = (innerHeight - 1920 * k) / 2 + "px";
}
fit(); addEventListener("resize", fit);
window.ready = Promise.all([document.fonts.load("700 100px 'Familjen Grotesk'"), document.fonts.load("500 40px 'Familjen Grotesk'"), document.fonts.load("500 26px 'IBM Plex Mono'")]).then(() => document.fonts.ready).then(async () => {
  await seek(IN_START + IN_DUR); restW = 0; await seek(0);
  if (capture) return;
  const t0 = performance.now(); let busy = false;
  const loop = async (now) => { if (!busy) { busy = true; await seek(Math.min(((now - t0) / 1000) % (DURATION + .8), DURATION - .001)); busy = false; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
